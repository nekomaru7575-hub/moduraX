<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>もじゅらX - オフライン</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
<!-- 通信が成立しなかったページ遷移のときに sw.js が返す控えのページ。
     インラインの<script>はCSP（script-src 'self'）で動かないので、
     「押すと再試行」は素のリンクだけで組む。 -->
<style>
  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    /* このページはオフライン時の受け皿で、sw.jsのPRECACHE_URLSに入っている。
       CSSファイルはプリキャッシュしていないので、css/tokens.cssを読みに行くと
       肝心のオフライン時に無地になる。ここだけは書体を直接書く（中身は同じ）。 */
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    margin: 0;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    text-align: center;
  }

  h1 {
    font-size: 1.3rem;
    margin: 0 0 12px;
  }

  /* 上と同じ事情で、js/icons.js も css/tokens.css も使えない（どちらもプリキャッシュ
     していない＝オフラインでは取りに行けない）。このページのアイコンだけは中身を
     直接書く。形を直すときは js/icons.js の wifi-off と揃えること。 */
  .icon {
    display: inline-block;
    width: 1em;
    height: 1em;
    vertical-align: -0.14em;
    margin-right: 0.35em;
  }

  p {
    color: #aaa;
    font-size: 0.95rem;
    line-height: 1.7;
    margin: 0 0 20px;
    max-width: 30em;
  }

  .btn {
    background-color: #007acc;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    padding: 12px 20px;
    text-decoration: none;
    display: inline-block;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <h1>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m2 2 20 20"/>
      <path d="M8.6 16.1a5 5 0 0 1 6.8 0"/>
      <path d="M5 12.6a10 10 0 0 1 5.2-2.4"/>
      <path d="M16.7 11.1A10 10 0 0 1 19 12.6"/>
      <path d="M1.5 9.1A16 16 0 0 1 6 6.2"/>
      <path d="M10.7 5.1A16 16 0 0 1 22.5 9.1"/>
      <path d="M12 20h.01"/>
    </svg>つながりませんでした
  </h1>
  <p>
    ネットワークに届かないため、このページを開けませんでした。<br>
    電波・Wi-Fiを確かめて、もう一度お試しください。
  </p>
  <p>
    部屋の中にいた場合、盤面やチャットの内容はサーバー側に残っています。
    つながり直せばそのまま続けられます。
  </p>
  <a class="btn" href="/">部屋一覧をひらく</a>
</body>
</html>
