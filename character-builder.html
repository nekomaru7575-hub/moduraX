<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>もじゅらX - コマ作成ツール</title>
<link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
<!-- 色のトークン。character-dialog.cssより必ず先に読むこと（var()の定義元） -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/character-dialog.css">

<!-- PWA。3つのHTMLで同じものを並べている。意図は index.html 側のコメントに書いた。 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="もじゅらX">
<link rel="apple-touch-icon" href="/image/apple-touch-icon-180.png">
<style>
  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    font-family: var(--font-body);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .app-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 2px solid #3a3a3a;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .app-header h1 {
    margin: 0;
    font-size: 1.4rem;
  }

  .app-header span {
    color: #888;
    font-size: 0.9rem;
  }

  .builder-card {
    background-color: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 16px;
  }

  .builder-form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
  }

  .builder-form-group label {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 4px;
  }

  .builder-form-group select,
  .builder-form-group input[type="file"] {
    background-color: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 8px;
    border-radius: 4px;
  }

  /* 読み込みボタンの下に置く注記。説明している相手（ボタン）の後ろに来るので、
     余白は上だけ持つ */
  .builder-hint {
    color: #888;
    font-size: 0.8rem;
    margin: 12px 0 0;
  }

  .builder-primary-btn {
    background-color: #007acc;
    color: #fff;
    font-weight: bold;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
  }

  .builder-primary-btn:disabled {
    background-color: #444;
    color: #888;
    cursor: not-allowed;
  }

  .builder-secondary-btn {
    background: none;
    border: 1px solid #555;
    color: #ddd;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
  }

  .builder-status {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #9fd39f;
  }

  .builder-error {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #f28b82;
  }

  /* ボタンの置き場所。縦に積み、カードの幅いっぱいまで伸ばして左右の端を揃える
     （横並びだと、文字数の違うボタンが不揃いな幅で並んで読みにくい。column方向の
     flexは既定で伸びるので、ボタン側に幅の指定は要らない）。 */
  .builder-action-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="app-header">
      <!-- ロゴはfaviconと同じ画像（見た目の指定は css/tokens.css の .app-logo） -->
      <h1 class="app-title"><img class="icon-lead app-logo" src="/image/iconDediDevi.ico" alt="">もじゅらX</h1>
      <span>コマ作成ツール</span>
      <!-- 他のページ（部屋入口・このサービスについて）への行き先。中身はjs/site-nav.js -->
      <button id="siteMenuBtn" class="app-menu-btn" type="button" title="メニュー" aria-label="メニュー"></button>
    </div>

    <div id="builderRoot"></div>
  </div>

  <script type="module" src="/js/character-builder.js"></script>
  <script type="module" src="/js/site-nav.js"></script>
</body>
</html>
