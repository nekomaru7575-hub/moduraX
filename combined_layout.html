<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG支援アプリ - イミュータブル＆EventBus設計</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin: 0;
    }

    .room-menu-btn {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .room-menu-btn:hover {
      background-color: #3a3a3a;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 75px);
      gap: 20px;
      box-sizing: border-box;
    }
    /* ダイアログ */
    .character-dialog {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      min-width: 320px;
      max-width: 720px;
    }

    .dialog-columns {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .dialog-main-column {
      flex: 1;
      min-width: 260px;
    }

    .dialog-plugin-column {
      flex: 1;
      min-width: 220px;
      padding-left: 20px;
      border-left: 1px solid #444;
    }

    .dialog-plugin-placeholder {
      color: #777;
      font-size: 0.85rem;
      margin: 0;
    }

    /* エフェクト等の「ボックス」編集ダイアログ */
    .effect-box-dialog {
      width: 100%;
      max-width: 640px;
    }

    .effect-box-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .effect-box-item {
      background-color: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .effect-box-header-row {
      display: flex;
      gap: 6px;
    }

    .effect-box-header-row input {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .effect-box-name {
      flex: 2;
      min-width: 0;
    }

    .effect-box-level {
      flex: 0 0 56px;
    }

    .effect-box-encroach {
      flex: 0 0 90px;
    }

    .effect-box-note {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
      resize: vertical;
      font-family: inherit;
    }

    .effect-box-limits {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .effect-box-limit-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #ccc;
    }

    .effect-box-limit-label {
      color: #aaa;
      width: 4em;
      flex-shrink: 0;
    }

    .effect-box-limit-current,
    .effect-box-limit-max {
      width: 52px;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .effect-box-limit-slash {
      color: #888;
    }

    .effect-box-limit-eb {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
    }

    /* 能力・技能値の表示ボックス */
    .ability-box-dialog {
      width: 100%;
      max-width: 480px;
    }

    .ability-box-group-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 12px;
    }

    .ability-box-group {
      background-color: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .ability-box-ability-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ability-box-ability-label {
      font-size: 1rem;
      color: #ccc;
    }

    .ability-box-ability-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
    }

    .ability-box-skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
    }

    .ability-box-skill {
      font-size: 0.8rem;
      color: #aaa;
    }

    .ability-box-skill-empty {
      color: #666;
    }

    .character-dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .character-dialog h3 {
      margin-top: 0;
      color: #fff;
    }

    .dialog-form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .dialog-form-group label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .dialog-form-group input {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .dialog-image-preview {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #555;
      margin-bottom: 8px;
    }

    .dialog-custom-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .dialog-custom-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 既存パラメータ一覧のラベル列。幅を固定し、数値入力・表示・削除の縦位置を全行で揃える */
    .dialog-param-label {
      flex: 0 0 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dialog-custom-row input {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
      flex: 1;
    }

    /* 数値入力欄はテキスト欄と同じ比率で広げる必要がないため、幅を固定して小さくする（元の約1/5）。
       min-width:0がないと、input要素のデフォルトの自動最小幅に負けて縮まないため必須 */
    .dialog-custom-row input[type="number"] {
      flex: 0 0 38px;
      min-width: 0;
      width: 38px;
      box-sizing: border-box;
      padding: 6px 4px;
      text-align: right;
    }

    .dialog-remove-row {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 0 10px;
      cursor: pointer;
    }

    .dialog-add-row-btn {
      background: none;
      border: 1px dashed #555;
      color: #aaa;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
    }

    .dialog-button-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .dialog-button-row button {
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    .dialog-confirm-btn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
    }

    /* キャラクター一覧のパラメータ表示 */
    .character-param-list {
      margin-top: 4px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .character-param-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #bbb;
    }

    /* キャラ一覧サイドバー専用（ルーム変数一覧とは見た目を分ける） */
    .character-list-param-row {
      display: grid;
      grid-template-columns: 4.4em 1fr;
      column-gap: 8px;
      font-size: 0.8rem;
      color: #bbb;
    }

    .character-param-label {
      color: #2ecc71;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .character-param-value {
      text-align: left;
    }
/* キャラクター一覧：main-area内に浮かせるオーバーレイ。
   盤面・チャット（board-area/control-area）のflex比率には関与しない。 */
    .character-panel-area {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 220px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      transition: width 0.15s ease;
      pointer-events: none;
    }

    .character-panel-area > * {
      pointer-events: auto;
    }

    .character-panel-area.collapsed {
      width: 28px;
    }

    .character-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
    }

    .character-panel-area.collapsed .character-panel {
      display: none;
    }

    .character-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .character-panel-header label {
      margin: 0;
    }

    .character-panel-collapse-btn {
      background: none;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      width: 22px;
      height: 22px;
      font-size: 0.8rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .character-panel-collapse-btn:hover {
      background-color: #3a3a3a;
    }

    .character-panel-expand-strip {
      display: none;
      width: 100%;
      height: 100%;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
      color: #aaa;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
      font-size: 0.8rem;
    }

    .character-panel-area.collapsed .character-panel-expand-strip {
      display: flex;
    }

    .character-panel-expand-strip:hover {
      background-color: #3a3a3a;
    }

/* 盤面＋コントロールのコンテナ。キャラ一覧オーバーレイの基準位置にもなる */
    .main-area {
      position: relative;
      flex: 1;
      display: flex;
      gap: 20px;
      height: 100%;
      min-width: 0; /* flexアイテムが縮まないバグを防止 */
    }

    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #board-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden; /* パン・ズームしてはみ出た部分をここで切り取る */
      cursor: grab;
    }

    #board {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        url('./background/test.jpg');
      background-size: 50px 50px, 50px 50px, cover;
      background-position: 0 0, 0 0, center;  /* ← ここを変更：グリッド線は左上基準、画像だけ中央 */
      background-repeat: repeat, repeat, no-repeat;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      transform-origin: 0 0;
    }

    .token {
      width: 40px;
      height: 40px;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      border: 2px solid #ffffff;
      border-radius: 10px;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
      z-index: 10;
      transition: top 0.05s ease-out, left 0.05s ease-out;
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: none;
    }

    .token-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
      overflow-y: auto;
    }

    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"] {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #characterList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .character-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #333;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .character-avatar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .character-avatar {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #fff;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .character-avatar-initiative {
      position: absolute;
      top: -4px;
      left: -4px;
      min-width: 14px;
      height: 14px;
      padding: 0 2px;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-avatar-name {
      font-size: 0.65rem;
      color: #bbb;
      max-width: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .context-menu {
      position: fixed;
      z-index: 1000;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      min-width: 140px;
      overflow: hidden;
      padding: 4px;
    }

    .context-menu-item {
      background: none;
      border: none;
      color: #e0e0e0;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .context-menu-item:hover {
      background-color: #3a3a3a;
    }

    .context-menu-item.danger:hover {
      background-color: #a8323f;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🎲 TRPG支援アプリ</h1>
    <button id="roomMenuBtn" class="room-menu-btn" title="ルームメニュー" type="button">⋮</button>
  </div>

  <dialog id="roomSettingsDialog" class="character-dialog">
    <form method="dialog">
      <h3>ルーム設定</h3>
      <div class="dialog-form-group">
        <label for="roomPluginSelect">ルームのプラグイン（システム）</label>
        <select id="roomPluginSelect"></select>
      </div>
      <label style="margin-top: 8px; display: block;">ルーム変数</label>
      <div id="roomParameterList" class="character-param-list"></div>
      <div class="dialog-button-row" style="margin-top: 16px;">
        <button type="submit" class="dialog-confirm-btn">閉じる</button>
      </div>
    </form>
  </dialog>
  <div class="app-container">
  <!-- 既存の盤面＋コントロールを、新しいラッパーで囲む -->
  <div class="main-area">
    <!-- キャラクター一覧：main-area内に浮かせるオーバーレイ。board-area/control-areaの大きさには影響しない -->
      <div class="character-panel-area" id="characterPanelArea">
        <div class="panel character-panel">
          <div class="character-panel-header">
            <label>登録済みキャラクター</label>
            <button type="button" id="characterPanelCollapseBtn" class="character-panel-collapse-btn" title="折りたたむ">◂</button>
          </div>
          <div id="characterList" style="flex: 1; max-height: none;"></div>
        </div>
        <button type="button" id="characterPanelExpandBtn" class="character-panel-expand-strip" title="展開する">キャラクター一覧</button>
      </div>

    <div class="board-area">
      <div id="board-viewport">
        <div id="board"></div>
      </div>
    </div>

    <div class="control-area">
      <div class="panel">
        <div class="form-group">
          <label for="gameSystem">ゲームシステム</label>
          <select id="gameSystem">
            <option value="Cthulhu7th">クトゥルフ神話TRPG (7版)</option>
            <option value="DoubleCross">ダブルクロス (3rd)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="characterParamSelect">参照キャラクター（{パラメータ名}を値に置換）</label>
          <select id="characterParamSelect">
            <option value="">（選択なし）</option>
          </select>
        </div>

        <div class="form-group">
          <label for="commandInput">コマンド入力 (例: CC(45) 隠れるロール、{HP}のように記述可)</label>
          <input type="text" id="commandInput" placeholder="CC(45) 隠れます" autocomplete="off">
        </div>

        <button class="btn-send" id="sendBtn">ダイスを振る</button>
      </div>

      <div class="log-container" id="logContainer">
        <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
      </div>
    </div>
  </div>

</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
