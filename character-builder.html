<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>もじゅらX - コマ作成ツール</title>

<!-- SNSに貼られたときのカード（OGP / Twitter Card）。
     クローラは相対パスを解決しないので、og:imageとog:urlは絶対URLで書くこと。
     画像はimage/配下に置く。docs/配下はserver/index.jsのPUBLIC_DIRSに無く、
     ブラウザでは見えても配信されず404になる（READMEのスクショを直に指すと事故る）。
     カードの実寸は横500px前後まで縮む。全画面のスクショを貼ると文字が潰れるため、
     image/ogp.pngは盤面の一部をほぼ等倍で切り出したものにしてある。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="もじゅらX">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="もじゅらX - コマ作成ツール">
<meta property="og:description" content="部屋を作らずにコマだけ作って書き出せます。外部のキャラクターシートのJSONやURLからも取り込めます。">
<meta property="og:url" content="https://modurax.onrender.com/character-builder.html">
<meta property="og:image" content="https://modurax.onrender.com/image/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="もじゅらXの盤面。コマとキャラクター一覧、秘匿つきHOのパネル、スタンプが並んでいる。">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
<!-- 色のトークン。character-dialog.cssより必ず先に読むこと（var()の定義元） -->
<!-- 読み込み失敗の見張り（js/boot-guard.js）。
     **必ずここ**——最初のCSS/JSより前で、かつ古典スクリプト（type="module"にしない）。
     モジュールは遅延実行されるので、moduleにすると見張りを始める前に他の読み込みが
     失敗しうる。1本でも届かないと画面は出たまま「接続中...」で永久に止まるため、
     気づけるようにしておく。 -->
<script src="/js/boot-guard.js"></script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/character-dialog.css">

<!-- PWA。3つのHTMLで同じものを並べている。意図は index.html 側のコメントに書いた。 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="もじゅらX">
<link rel="apple-touch-icon" href="/image/apple-touch-icon-180.png">
<link rel="stylesheet" href="/css/character-builder.css">
</head>
<body>
  <div class="page">
    <div class="app-header">
      <!-- ロゴはfaviconと同じ画像（見た目の指定は css/tokens.css の .app-logo） -->
      <h1 class="app-title"><img class="icon-lead app-logo" src="/image/iconDediDevi.ico" alt="">もじゅらX</h1>
      <span>コマ作成ツール</span>
      <!-- 他のページ（部屋入口・部屋データの取り込み・リリースノート・このサービスについて）への行き先。中身はjs/site-nav.js -->
      <button id="siteMenuBtn" class="app-menu-btn" type="button" title="メニュー" aria-label="メニュー"></button>
    </div>

    <div id="builderRoot"></div>
  </div>

  <script type="module" src="/js/character-builder.js"></script>
  <script type="module" src="/js/site-nav.js"></script>
</body>
</html>
