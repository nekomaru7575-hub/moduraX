<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG支援アプリ - イミュータブル＆EventBus設計</title>
  <style>
    /* 全体の基本デザイン（ダークモード基調） */
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      width: 100%;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 75px);
      gap: 20px;
      box-sizing: border-box;
    }

    /* 左側：盤面エリア (70%) */
    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #board {
      position: relative;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        url('./background/test.jpg');
      background-size: 50px 50px, 50px 50px, cover;
      background-position: center;
      background-repeat: repeat, repeat, no-repeat;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    /* トークン（コマ） */
    .token {
      width: 40px;
      height: 40px;
      background-color: #ff4757;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
      z-index: 10;
      transition: top 0.05s ease-out, left 0.05s ease-out; /* 滑らかな追従 */
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: none;
    }

    .token-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }

    /* 右側：コントロールエリア (30%) */
    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
      overflow-y: auto;
    }

    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"] {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* キャラクター一覧 */
    #characterList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .character-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #333;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .character-color-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid #fff;
    }

    .character-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-delete-char {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .btn-delete-char:hover {
      background-color: #a8323f;
      border-color: #a8323f;
      color: #fff;
    }
    .context-menu {
      position: fixed;
      z-index: 1000;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      min-width: 140px;
      overflow: hidden;
      padding: 4px;
      }

    .context-menu-item {
      background: none;
      border: none;
      color: #e0e0e0;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .context-menu-item:hover {
      background-color: #3a3a3a;
    }

    .context-menu-item.danger:hover {
      background-color: #a8323f;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>🎲 TRPG支援アプリ（イミュータブル＆データ駆動版）</h1>

  <div class="app-container">
    <div class="board-area">
      <!-- トークンはStateから動的に生成されます（js/board-data-driven.js） -->
      <div id="board"></div>
    </div>

    <div class="control-area">
      <div class="panel">
        <div class="form-group">
          <label for="gameSystem">ゲームシステム</label>
          <select id="gameSystem">
            <option value="Cthulhu7th">クトゥルフ神話TRPG (7版)</option>
            <option value="DoubleCross">ダブルクロス (3rd)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="commandInput">コマンド入力 (例: CC(45) 隠れるロール)</label>
          <input type="text" id="commandInput" placeholder="CC(45) 隠れます" autocomplete="off">
        </div>

        <button class="btn-send" id="sendBtn">ダイスを振る</button>
      </div>

      <div class="panel">
        <label>登録済みキャラクター（追加は盤面を右クリック／削除はトークンを右クリック）</label>
        <div id="characterList"></div>
      </div>

      <div class="log-container" id="logContainer">
        <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
