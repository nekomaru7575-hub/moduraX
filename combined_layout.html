<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もじゅらX</title>
  <link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
  <link rel="stylesheet" href="/css/character-dialog.css">
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin: 0;
      flex: 1;
    }

    .net-status {
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .room-name-label {
      color: #999;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .net-status-connected {
      color: #4caf50;
    }

    .net-status-connecting {
      color: #e0a020;
    }

    .net-status-disconnected {
      color: #e05252;
    }

    .room-menu-btn {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .room-menu-btn:hover {
      background-color: #3a3a3a;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 75px);
      gap: 20px;
      box-sizing: border-box;
    }
    /* ダイアログ/エフェクト・コンボ/能力技能ボックス/DX3拡張パネルのCSSは
       css/character-dialog.css へ移動（character-builder.htmlと共有するため） */

    /* キャラクター一覧のパラメータ表示 */
    .character-param-list {
      margin-top: 4px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .character-param-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #bbb;
    }

    /* キャラ一覧サイドバー専用（ルーム変数一覧とは見た目を分ける） */
    .character-list-param-row {
      display: grid;
      grid-template-columns: 4.4em 1fr;
      column-gap: 8px;
      font-size: 0.8rem;
      color: #bbb;
    }

    .character-param-label {
      color: #2ecc71;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .character-param-value {
      text-align: left;
    }
/* キャラクター一覧：main-area内に浮かせるオーバーレイ。
   盤面・チャット（board-area/control-area）のflex比率には関与しない。 */
    .character-panel-area {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 220px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      transition: width 0.15s ease;
      pointer-events: none;
    }

    .character-panel-area > * {
      pointer-events: auto;
    }

    .character-panel-area.collapsed {
      width: 28px;
    }

    .character-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
    }

    .character-panel-area.collapsed .character-panel {
      display: none;
    }

    .character-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .character-panel-header label {
      margin: 0;
    }

    .character-panel-collapse-btn {
      background: none;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      width: 22px;
      height: 22px;
      font-size: 0.8rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .character-panel-collapse-btn:hover {
      background-color: #3a3a3a;
    }

    .character-panel-expand-strip {
      display: none;
      width: 100%;
      height: 100%;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
      color: #aaa;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
      font-size: 0.8rem;
    }

    .character-panel-area.collapsed .character-panel-expand-strip {
      display: flex;
    }

    .character-panel-expand-strip:hover {
      background-color: #3a3a3a;
    }

    /* バックヤードパネル：キャラ一覧パネルと同じ挙動を右側に配置しただけの変種 */
    .backyard-panel-area {
      left: auto;
      right: 0;
    }

    .backyard-panel-area .character-panel {
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
    }

    .backyard-panel-area .character-panel-expand-strip {
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
    }

/* 盤面＋コントロールのコンテナ。キャラ一覧オーバーレイの基準位置にもなる */
    .main-area {
      position: relative;
      flex: 1;
      display: flex;
      gap: 20px;
      height: 100%;
      min-width: 0; /* flexアイテムが縮まないバグを防止 */
    }

    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #board-viewport {
      position: relative;
      width: 100%;
      flex: 3;
      min-height: 0;
      overflow: hidden; /* パン・ズームしてはみ出た部分をここで切り取る */
      cursor: grab;
    }

    /* ラウンド進行（Core機能）の常時表示ステータスバー。js/round-panel.js参照 */
    .round-panel-bar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
      transition: margin 0.15s ease;
    }

    /* キャラクター一覧／バックヤードパネル（左右に浮かぶオーバーレイ）を、ラウンド進行
       バーの中身がその下に隠れないよう常に避ける。展開中は幅220px、折りたたみ中も
       展開ストリップ（幅28px）が残るので、どちらの状態でもその分の余白を空ける。
       横に置けない分は折り返して縦に伸びてよい。 */
    #characterPanelArea ~ .board-area .round-panel-bar,
    #characterPanelArea ~ .board-area .round-panel-detail {
      margin-left: 220px;
    }

    #characterPanelArea.collapsed ~ .board-area .round-panel-bar,
    #characterPanelArea.collapsed ~ .board-area .round-panel-detail {
      margin-left: 28px;
    }

    #backyardPanelArea ~ .board-area .round-panel-bar,
    #backyardPanelArea ~ .board-area .round-panel-detail {
      margin-right: 220px;
    }

    #backyardPanelArea.collapsed ~ .board-area .round-panel-bar,
    #backyardPanelArea.collapsed ~ .board-area .round-panel-detail {
      margin-right: 28px;
    }

    .round-panel-status {
      color: #e0e0e0;
      font-size: 0.9rem;
      font-weight: bold;
      user-select: none;
    }

    .round-panel-nickname {
      color: #999;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* 常に単独の行（2行目）を占有させる。1行目（ステータス・ニックネーム・ボタン）と
       混在して折り返し位置が不安定にならないようにするため。 */
    .round-panel-ready-list {
      flex: 1 0 100%;
      color: #ccc;
      font-size: 0.85rem;
    }

    .round-panel-btn {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .round-panel-action-btn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
      border-color: #007acc;
    }

    .round-panel-btn.active {
      background-color: #2e7d32;
      color: #fff;
      border-color: #2e7d32;
    }

    .round-panel-detail {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .round-panel-turn-row {
      background-color: #2a2a2a;
      color: #ccc;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.8rem;
    }

    .round-panel-turn-row.active-turn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
    }

    /* 盤面下1/4：既存ログのミラー表示エリア */
    .current-chat-bar {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    /* キャラ一覧パネル（オーバーレイ）と重なりうる左側領域。
       通常のログは置かず、直近に発言した参照キャラクターの立ち絵（未設定なら空）だけを表示する */
    .current-chat-portrait {
      flex: 0 0 220px;
      height: 100%;
      background-color: #111;
      background-size: contain;
      background-position: bottom center;
      background-repeat: no-repeat;
    }

    .current-chat-log {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    .current-chat-log-item {
      font-size: 1.05rem;
      color: #ddd;
      animation: fadeIn 0.3s ease-out;
    }

    /* ダイス結果等の本文。通常のログでは1.1rem、カレントチャット欄では
       最新発言1件だけを大きく見せたいのでさらに拡大する */
    .log-result-text {
      font-size: 1.1rem;
    }

    .current-chat-log-item .log-result-text {
      font-size: 1.4rem;
    }

    #board {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #808080;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 25px 25px, 25px 25px;
      background-position: 0 0, 0 0;
      background-repeat: repeat, repeat;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      transform-origin: 0 0;
    }

    .token {
      width: 25px;
      height: 25px;
      background-color: transparent;
      overflow: hidden;
      border: 2px solid #ffffff;
      border-radius: 10px;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
      z-index: 10;
      transition: top 0.05s ease-out, left 0.05s ease-out;
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: none;
    }

    /* コマ画像。内側に敷き、トリミング設定(object-position/transform)で見え方を変える。
       名前(.token-name)より下に来るよう、名前側にz-indexを持たせている。 */
    .token-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .token-name {
      position: relative;
      z-index: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* パネル：コマの下に敷くマップタイル状オブジェクト（盤面上／盤面外に配置可能） */
    .panel-object {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.06);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      box-sizing: border-box;
      cursor: grab;
      user-select: none;
      z-index: 5;
    }

    .panel-object:active {
      cursor: grabbing;
    }

    /* 固定中のパネル：ドラッグ移動できない（背景タイル扱い）。実線枠と通常カーソルで示す */
    .panel-object.locked {
      cursor: default;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .panel-object.locked:active {
      cursor: default;
    }

    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
      overflow-y: auto;
    }

    /* チャット送信欄＋チャットパレットの統合区画。ログとの間のみリサイズ可能 */
    .chat-send-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    /* チャット欄：ゲームシステム/参照キャラクターの選択は小さく横並びにする */
    .chat-input-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input-selects {
      display: flex;
      gap: 6px;
    }

    .compact-select {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font-size: 0.75rem;
    }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-input-row textarea {
      flex: 1;
      min-width: 0;
      resize: vertical;
      font-family: inherit;
      line-height: 1.4;
    }

    .chat-input-row .btn-send {
      width: auto;
      flex-shrink: 0;
      align-self: stretch;
      padding: 8px 16px;
    }

    /* チャットパレット：保存フレーズをクリックだけで送信できるボタン一覧 */
    .chat-palette-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-palette-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }

    .chat-palette-btn {
      background-color: #333;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-palette-btn:hover {
      background-color: #3f3f3f;
    }

    .chat-palette-empty {
      color: #666;
      font-size: 0.8rem;
      margin: 0;
      padding: 4px;
    }

    .chat-palette-edit-btn {
      align-self: flex-end;
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-palette-edit-btn:hover {
      background-color: #3a3a3a;
    }

    .chat-palette-editor-dialog {
      width: 100%;
      max-width: 480px;
    }

    .chat-palette-editor-hint {
      color: #999;
      font-size: 0.8rem;
      margin: 0 0 8px;
    }

    .chat-palette-editor-textarea {
      width: 100%;
      min-height: 240px;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
    }

    /* ログ／チャット欄／チャットパレットの高さをユーザーがドラッグで調整するためのハンドル */
    .resize-handle {
      flex: 0 0 10px;
      cursor: row-resize;
      position: relative;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      left: 25%;
      right: 25%;
      top: 4px;
      height: 2px;
      background-color: #444;
      border-radius: 1px;
    }

    .resize-handle:hover::after,
    .resize-handle.dragging::after {
      background-color: #007acc;
    }

    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"], textarea {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .log-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .chat-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 6px;
      overflow-x: auto;
    }

    .chat-tab {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 0 0 4px 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chat-tab:hover {
      background-color: #333;
      color: #fff;
    }

    .chat-tab.active {
      background-color: #007acc;
      color: #fff;
      border-color: #007acc;
    }

    .chat-tab-add {
      background: none;
      color: #888;
      border: 1px dashed #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-tab-add:hover {
      color: #fff;
      border-color: #007acc;
    }

    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #characterList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .character-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #333;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .character-avatar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .character-avatar {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #fff;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .character-avatar-initiative {
      position: absolute;
      top: -4px;
      left: -4px;
      min-width: 14px;
      height: 14px;
      padding: 0 2px;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-avatar-name {
      font-size: 0.65rem;
      color: #bbb;
      max-width: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .context-menu {
      position: fixed;
      z-index: 1000;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;

        <span class="round-panel-nickname" id="roundPanelNicknameLabel"></span>
        <button type="button" id="roundPanelReadyToggleBtn" class="round-panel-btn">割り込みなし</button>
        <button type="button" id="roundPanelActionBtn" class="round-panel-btn round-panel-action-btn">ラウンド進行を開始</button>
        <button type="button" id="roundPanelMenuBtn" class="round-panel-btn" title="参加者編集・終了">⋮</button>
        <div class="round-panel-ready-list" id="roundPanelReadyList"></div>
      </div>
      <div class="round-panel-detail" id="roundPanelDetail" style="display: none;"></div>

      <div id="board-viewport">
        <div id="board"></div>
      </div>

      <!-- 盤面下1/4：既存ログのミラー表示。左側（キャラ一覧パネルと重なりうる領域）は
           チャット表示を置かず、直近に発言した参照キャラクターの立ち絵表示に充てる -->
      <div class="current-chat-bar" id="currentChatBar">
        <div class="current-chat-portrait" id="currentChatPortrait"></div>
        <div class="current-chat-log" id="currentChatLog"></div>
      </div>
    </div>

    <div class="control-area" id="controlArea">
      <!-- 上段：ログ＋チャットタブ。タブは入力欄に近い下側に置く -->
      <div class="log-section" data-resizable-section="log">
        <div class="log-container" id="logContainer">
          <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
        </div>
        <div class="chat-tabs" id="chatTabs"></div>
      </div>

      <!-- 下段：チャット送信欄＋チャットパレットを統合。ログとの間のみリサイズ可能 -->
      <div class="chat-send-panel" data-resizable-section="chatSend">
        <div class="panel chat-input-panel">
          <div class="chat-input-selects">
            <select id="characterParamSelect" class="compact-select" title="参照キャラクター（{パラメータ名}の置換・送信元）">
              <option value="">（選択なし）</option>
            </select>
          </div>
          <div class="chat-input-row">
            <textarea id="commandInput" rows="3" placeholder="CC(45) 隠れます／{HP}／+侵蝕率(10)"></textarea>
            <button class="btn-send" id="sendBtn">送信</button>
          </div>
        </div>

        <div class="chat-palette-panel" id="chatPalettePanel"></div>
      </div>
    </div>
  </div>

</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
