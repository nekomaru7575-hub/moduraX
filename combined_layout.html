<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 盤面が自前でズームを持つので、ブラウザのページズームは殺す（js/no-browser-zoom.js）。
       maximum-scale=1.0は「入力欄をタップすると勝手に拡大する」（iOS Safari）にも効く。
       viewport-fit=coverが要るのは、下のenv(safe-area-inset-*)を効かせるため。これが無いと
       insetは常に0を返し、ホームバーを避けるための指定が黙って無視される。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>もじゅらX</title>
  <link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
  <link rel="stylesheet" href="/css/character-dialog.css">

  <!-- PWA。3つのHTMLで同じものを並べている。意図は index.html 側のコメントに書いた。 -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="もじゅらX">
  <link rel="apple-touch-icon" href="/image/apple-touch-icon-180.png">
  <style>
    /* ピンチズーム／ダブルタップズームを外す（スクロールは残す）。
       #board-viewport等のtouch-action:noneは要素側が優先されるので盤面の自前ピンチは動く。 */
    html {
      touch-action: pan-x pan-y;
      /* 「引っ張って更新」と端でのゴム跳ねを止める。盤面やチャット欄を指で動かすたびに
         ページ全体が動いたり読み込み直したりされると操作にならない。
         ホーム画面から起動した状態（standalone）でもAndroid Chromeは引っ張って更新が
         生きているので、そちらにも効かせる意味がある。 */
      overscroll-behavior: none;
    }

    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      touch-action: pan-x pan-y;
      /* 文字選択を止める。長押しでメニューを出すたびにコピーの選択が始まって邪魔になるため
         （盤面だけでなく、長押しメニューを出すところ全般で起きる）。
         入力欄だけは下で選択可に戻す。ログの書き出しは「ログを保存」が担う。 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      /* スマホはアドレスバーの出入りで100vhが画面より大きくなり、下端のチャット欄が
         隠れてしまう。dvhは実際に見えている高さを指すので、対応ブラウザではこちらが勝つ。 */
      height: 100dvh;
      box-sizing: border-box;
    }

    /* 入力中の文を選び直す・貼り付けるは残す必要があるので、フォーム部品だけ選択可に戻す */
    input,
    textarea,
    select,
    [contenteditable] {
      user-select: text;
      -webkit-user-select: text;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin: 0;
      flex: 1;
    }

    .net-status {
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .room-name-label {
      color: #999;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .net-status-connected {
      color: #4caf50;
    }

    .net-status-connecting {
      color: #e0a020;
    }

    .net-status-disconnected {
      color: #e05252;
    }

    .room-menu-btn {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .room-menu-btn:hover {
      background-color: #3a3a3a;
    }

    /* bodyがflexの縦並びなので、ヘッダーの残り全部をここが取る。
       以前はcalc(100vh - 75px)とヘッダー高さを決め打ちしていたが、ヘッダーが1行に
       収まらない幅で高さが変わると盤面がはみ出すため、flexに任せる。 */
    .app-container {
      display: flex;
      width: 100%;
      flex: 1;
      min-height: 0;
      gap: 20px;
      box-sizing: border-box;
    }
    /* ダイアログ/エフェクト・コンボ/能力技能ボックス/DX3拡張パネルのCSSは
       css/character-dialog.css へ移動（character-builder.htmlと共有するため） */

    /* キャラクター一覧のパラメータ表示 */
    .character-param-list {
      margin-top: 4px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .character-param-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #bbb;
    }

    /* キャラクター一覧パネル専用（ルーム変数一覧とは見た目を分ける） */
    .character-list-param-row {
      display: grid;
      grid-template-columns: 4.4em 1fr;
      column-gap: 8px;
      font-size: 0.8rem;
      color: #bbb;
      /* ラベル（日本語）と値（数字）は別のグリッドアイテムなので、line-height:normalのままだと
         それぞれが自分の実フォント（日本語はフォールバック）の行の高さになり、同じ行の中で
         ベースラインが3pxほどずれる（行の高さも15px/19pxと不揃いになる）。行の高さを明示して
         両方のベースラインを揃える。 */
      line-height: 1.4;
    }

    .character-param-label {
      color: #2ecc71;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .character-param-value {
      text-align: left;
    }
/* キャラクター一覧：浮動パネル（js/character-panel.js）の中身。盤面のコマと
   バックヤードのコマをタブで切り替えて並べる。枠と移動/拡縮は.floating-panel側。 */
    .character-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .character-panel-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .character-panel-tab {
      background-color: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px 4px 0 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .character-panel-tab.is-active {
      background-color: #444;
      color: #fff;
      border-color: #777;
    }

    .character-panel-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .character-panel-empty {
      color: #888;
      font-size: 0.8rem;
      margin: 4px 2px;
    }

    /* バックヤードタブの「盤面に戻す」。行の右端へ寄せる */
    .character-panel-restore-btn {
      margin-left: auto;
      flex-shrink: 0;
      background-color: #3a3a3a;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .character-panel-restore-btn:hover {
      background-color: #4a4a4a;
      color: #fff;
    }

/* 盤面＋コントロールのコンテナ */
    .main-area {
      position: relative;
      flex: 1;
      display: flex;
      gap: 20px;
      height: 100%;
      min-width: 0; /* flexアイテムが縮まないバグを防止 */
    }

    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #board-viewport {
      position: relative;
      width: 100%;
      flex: 3;
      min-height: 0;
      overflow: hidden; /* パン・ズームしてはみ出た部分をここで切り取る */
      cursor: grab;
      /* パン・ピンチはjs/board-data-driven.jsが自前で処理する。ブラウザ既定のスクロールや
         ズームに指を取られると、1本指ドラッグが盤面に届かない。 */
      touch-action: none;
    }

    /* 3Dダイスを転がす場所（js/dice-animation.js）。盤面にぴったり重ね、盤面外へは出さない。
       ダイスは駒(.token, z-index:10)より手前、浮動パネル(.floating-panel, z-index:60)より奥。
       表示していない間は盤面の操作（パン・ズーム・駒のドラッグ）を邪魔しないよう素通しにする。
       display:noneにしないのは、canvasの大きさが0になってライブラリの初期化に失敗するため。 */
    .dice-stage {
      position: absolute;
      inset: 0;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }

    /* 転がっている間だけ。クリックで消せるようここでポインタを受け取る */
    .dice-stage.is-rolling {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    /* スタンプ（js/stamp-layer.js）。盤面の右上に重ね、1分ほどで自動的に消える合図。
       ダイス(z-index:40)より手前・浮動パネル(60)より奥。盤面のパン・コマのドラッグを
       邪魔しないよう、レイヤーもスタンプ自身もポインタを素通しにする。 */
    #stampLayer {
      --stamp-column-width: 84px;
      position: absolute;
      top: 8px;
      right: 8px;
      /* 列は右詰めで左へ伸びる。上限5列分の幅を確保しておく */
      width: calc(5 * var(--stamp-column-width));
      height: 0; /* 中身はabsoluteなので高さは要らない。盤面のクリック領域を奪わない */
      z-index: 50;
      pointer-events: none;
    }

    .stamp-item {
      position: absolute;
      width: var(--stamp-column-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      pointer-events: none;
      /* 出た瞬間だけふわっと入れる。消えるのはJS側のsetTimeout（1分） */
      animation: stamp-pop 0.18s ease-out;
    }

    @keyframes stamp-pop {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    .stamp-item-image {
      width: 64px;
      height: 64px;
      object-fit: contain;
      /* 盤面の背景が明るくても暗くても見えるように、輪郭を落とす */
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
    }

    /* 画像がまだ置かれていないときの代わり（js/stamp-layer.jsのerrorハンドラ）。
       仕組みだけ先に動かして確かめられるようにするためのもの。 */
    .stamp-item-fallback {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2px;
      text-align: center;
      font-size: 0.7rem;
      line-height: 1.2;
      color: #eee;
      background-color: rgba(40, 40, 40, 0.85);
      border: 1px dashed #888;
      border-radius: 8px;
    }

    .stamp-item-name {
      max-width: 100%;
      font-size: 0.7rem;
      color: #fff;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* 列（＝参加者）ごとに、名前を出すのは一番新しい1枚だけ。連投すると同じ名前が
       縦に並んで読みづらいため（js/stamp-layer.jsのrefreshColumnNames）。 */
    .stamp-item.is-name-hidden .stamp-item-name {
      display: none;
    }

    /* スタンプ送信パネル（js/stamp-panel.js）。浮動パネルの中身なので、枠の見た目は
       .floating-panel側が持つ。ここは画像ボタンの並べ方だけ。 */
    .stamp-send-notice {
      margin-bottom: 6px;
      padding: 4px 6px;
      font-size: 0.75rem;
      line-height: 1.4;
      color: #ffd479;
      background-color: rgba(255, 212, 121, 0.1);
      border: 1px solid rgba(255, 212, 121, 0.35);
      border-radius: 4px;
    }

    /* 幅に合わせて折り返す。1枚あたり72pxを下限に、余った幅は等分する */
    .stamp-send-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 6px;
    }

    .stamp-send-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }

    .stamp-send-btn:hover:not(:disabled) {
      background-color: #333;
      border-color: #007acc;
    }

    /* 押せないのは、名前が未設定のときと連打よけの上限に達したとき（理由は上の案内に出る） */
    .stamp-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .stamp-send-image {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    /* 画像がまだ置かれていないときの代わり（.stamp-item-fallbackと同じ役目） */
    .stamp-send-fallback {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2px;
      text-align: center;
      font-size: 0.65rem;
      line-height: 1.2;
      color: #eee;
      border: 1px dashed #888;
      border-radius: 6px;
    }

    .stamp-send-label {
      max-width: 100%;
      font-size: 0.7rem;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 誰が何枚出したかの集計（js/stamp-panel.js）。プラグインのスタンプが1枚も
       出ていない間は、セクションごとJS側で隠す。 */
    .stamp-count-section {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #3a3a3a;
    }

    .stamp-count-heading {
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ddd;
    }

    .stamp-count-heading:first-child {
      margin-top: 0;
    }

    .stamp-count-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 1px 0 1px 8px;
      font-size: 0.75rem;
      color: #bbb;
    }

    /* 名前は長くなりうるので、はみ出す側はこちらに寄せる（枚数は必ず読めるように） */
    .stamp-count-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stamp-count-value {
      flex: 0 0 auto;
      color: #eee;
    }

    .stamp-count-reset {
      margin-top: 8px;
      width: 100%;
      padding: 4px;
      background-color: #2a2a2a;
      color: #bbb;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .stamp-count-reset:hover:not(:disabled) {
      background-color: #333;
      color: #fff;
    }

    .stamp-count-reset:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ダイスドラフト（js/dice-draft-panel.js）。浮動パネルの中身なので、枠の見た目は
       .floating-panel側が持つ。ここはダイスの絵と、落とし先の枠の見せ方だけ。 */
    .dice-draft-body {
      gap: 8px;
    }

    .dice-draft-notice {
      flex: 0 0 auto;
      font-size: 0.75rem;
      color: #e0b070;
      line-height: 1.4;
    }

    .dice-draft-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dice-draft-owner {
      font-size: 0.8rem;
      font-weight: bold;
      color: #fff;
    }

    .dice-draft-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dice-draft-heading {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ddd;
    }

    .dice-draft-empty {
      font-size: 0.7rem;
      color: #777;
      line-height: 1.4;
    }

    /* ダイスの落とし先。空でも高さを保つ（潰れているとドロップ先を狙えない）。
       ハイライトはドラッグ中にJS側がis-drop-hoverを付け外しする。 */
    .dice-draft-pool,
    .dice-draft-slot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      min-height: 40px;
      padding: 4px;
      background-color: #2a2a2a;
      border: 1px dashed #4a4a4a;
      border-radius: 4px;
    }

    .dice-draft-pool.is-drop-hover,
    .dice-draft-slot.is-drop-hover {
      border-color: #6aa9e0;
      border-style: solid;
      background-color: #33404a;
    }

    /* ダイス1個。1〜6はピップのSVG、それ以外は数字（js/dice-draft-panel.jsのrenderDieFace）。
       touch-action:noneは.tokenと同じ理由：指で掴めるようにするため、ブラウザのスクロールに
       先に取られないようにする。 */
    .dice-draft-die {
      position: relative;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
      color: #222;
      border: 1px solid #999;
      border-radius: 5px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .dice-draft-die.is-draggable {
      cursor: grab;
      touch-action: none;
    }

    .dice-draft-die.is-dragging {
      opacity: 0.3;
    }

    .dice-draft-pips {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .dice-draft-number {
      font-size: 0.85rem;
      font-weight: bold;
    }

    /* 面数が6でないときだけ出す。これが無いとd10の「3」がd6の「3」と見分けられない */
    .dice-draft-sides {
      position: absolute;
      right: 1px;
      bottom: 0;
      font-size: 0.5rem;
      color: #777;
      line-height: 1;
    }

    /* 掴んだダイスに追従する影。落とし先はdocument.elementFromPointで拾うので、
       これ自身が拾われないようpointer-events:noneにする。
       z-indexは.floating-panel(60)より上、.context-menu(1000)より下。 */
    .dice-draft-ghost {
      position: fixed;
      z-index: 65;
      pointer-events: none;
      opacity: 0.9;
      transform: scale(1.1);
    }

    /* スキルは正方形のカードを横に連ね、パネルの幅で折り返す。
       1fr で伸ばさず固定幅にしてあるのは、伸ばすと aspect-ratio で高さまで一緒に伸びて
       パネルの半分がカード1枚で埋まってしまうため。 */
    .dice-draft-skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .dice-draft-skill {
      flex: 0 0 auto;
      /* 枠線と余白を含めて116px四方。border-boxを明示しないとこのページの既定
         （content-box）で余白のぶんだけ広がり、1行に並ぶ枚数がずれる。
         116pxは「名前・ダイス1段・状態・発動ボタン」がちょうど収まる最小の高さで、
         これより小さくするとダイスの段が26pxを割ってスクロールが出る。 */
      box-sizing: border-box;
      width: 116px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 5px;
      overflow: hidden;
      background-color: #333;
      border: 1px solid #444;
      border-radius: 5px;
    }

    /* 名前も状態も枠より長くなりうる。折り返して高さを増やすと正方形が崩れるので、
       1行に収めて省略記号へ逃がす（全文は title で読める）。 */
    .dice-draft-skill-name {
      flex: 0 0 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.75rem;
      color: #fff;
    }

    /* カードの中で余った高さを全部もらう。ダイスが増えたらここだけが縦にスクロールする */
    .dice-draft-skill .dice-draft-slot {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      align-content: flex-start;
      gap: 3px;
      padding: 3px;
    }

    .dice-draft-skill .dice-draft-die {
      width: 26px;
      height: 26px;
    }

    /* 発動ボタンの行。一致型は「1回」「全て」の2つ、合計型は「使用」1つ。
       どちらでも高さが変わらないよう、幅は等分にして折り返さない。 */
    .dice-draft-use-row {
      flex: 0 0 auto;
      display: flex;
      gap: 3px;
    }

    .dice-draft-use-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 2px 2px;
      background-color: #2a4a2a;
      color: #dfd;
      border: 1px solid #4a6a4a;
      border-radius: 4px;
      font-size: 0.72rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .dice-draft-use-btn:hover:not(:disabled) {
      background-color: #356035;
      color: #fff;
    }

    .dice-draft-use-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dice-draft-status {
      flex: 0 0 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.62rem;
      color: #999;
    }

    .dice-draft-status.is-ready {
      color: #8ec98e;
    }

    /* スキル一覧の絞り込み（ドラクルージュの 戦／常／終）。パネルが狭いので折り返す */
    .dice-draft-tabs {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }

    .dice-draft-tab {
      flex: 1 1 auto;
      min-width: 40px;
      padding: 3px 6px;
      background-color: #2a2a2a;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .dice-draft-tab:hover {
      background-color: #333;
      color: #fff;
    }

    .dice-draft-tab.is-active {
      background-color: #2a4a2a;
      color: #dfd;
      border-color: #4a6a4a;
    }

    /* 目標値に幅があるスキルの「どれを狙うか」。枠の幅を超えないよう横幅は目一杯にする */
    .dice-draft-target {
      flex: 0 0 auto;
      width: 100%;
      padding: 1px 2px;
      background-color: #2a2a2a;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.66rem;
    }

    .dice-draft-migrate-btn {
      flex: 0 0 auto;
      width: 100%;
      padding: 5px;
      background-color: #2a2a2a;
      color: #bbb;
      border: 1px dashed #555;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .dice-draft-migrate-btn:hover {
      background-color: #333;
      color: #fff;
    }

    /* ラウンド進行（Core機能）の常時表示ステータスバー。js/round-panel.js参照 */
    .round-panel-bar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .round-panel-status {
      color: #e0e0e0;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .round-panel-nickname {
      color: #999;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* 常に単独の行（2行目）を占有させる。1行目（ステータス・ニックネーム・ボタン）と
       混在して折り返し位置が不安定にならないようにするため。 */
    .round-panel-ready-list {
      flex: 1 0 100%;
      color: #ccc;
      font-size: 0.85rem;
    }

    /* プロットの提出欄。「割り込みなし」一覧と同じく単独の行を占有させる。 */
    .round-panel-plot {
      flex: 1 0 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #ccc;
    }

    /* 自分のコマ1つ分の提出欄（コマ名 + 1〜6のボタン）。複数のコマを持つ人がいるので行で分ける */
    .round-panel-plot-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      flex: 1 0 100%;
    }

    .round-panel-plot-name {
      color: #e0e0e0;
      margin-right: 2px;
    }

    .round-panel-plot-btn {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      min-width: 28px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* 自分が今出している数字。公開前は自分にだけ見えている状態なので、はっきり示す */
    .round-panel-plot-btn.selected {
      background-color: #007acc;
      color: #fff;
      border-color: #007acc;
      font-weight: bold;
    }

    .round-panel-plot-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* 他の人が出した分の「提出済み」表示（値は見せない） */
    .round-panel-plot-note {
      color: #8fbf8f;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    /* 提出状況（公開前は●/○だけ、公開後は値）。 */
    .round-panel-plot-status {
      flex: 1 0 100%;
      color: #aaa;
      font-size: 0.8rem;
    }

    .round-panel-btn {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .round-panel-action-btn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
      border-color: #007acc;
    }

    .round-panel-btn.active {
      background-color: #2e7d32;
      color: #fff;
      border-color: #2e7d32;
    }

    .round-panel-detail {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .round-panel-turn-row {
      background-color: #2a2a2a;
      color: #ccc;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.8rem;
    }

    .round-panel-turn-row.active-turn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
    }

    /* このラウンドで行動を終えたコマ。手番が回ってこないことが一目で分かるよう薄く沈める
       （GMがクリックして「行動済みを解除」すると戻る。js/round-panel.js参照） */
    .round-panel-turn-row.acted {
      color: #777;
      text-decoration: line-through;
      opacity: 0.75;
    }

    /* 次の手番に割り込む予約が入っているコマ */
    .round-panel-turn-row.interrupt-reserved {
      border: 1px solid #d0a000;
      color: #f0c040;
    }

    /* プロットが同値のコマ。ルール上は同時処理で、並び順はCoreが決めた便宜上のもの
       （js/game-store.jsのsortForTurnOrder）。それが一目で分かるように点線で囲う。 */
    .round-panel-turn-row.plot-tied {
      border: 1px dashed #7aa7c7;
    }

    .round-panel-turn-row.clickable {
      cursor: pointer;
    }

    .round-panel-turn-row.clickable:hover {
      background-color: #3a3a3a;
    }

    /* 盤面下1/4：既存ログのミラー表示エリア */
    .current-chat-bar {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    /* キャラ一覧パネル（オーバーレイ）と重なりうる左側領域。
       通常のログは置かず、直近に発言した参照キャラクターの立ち絵（未設定なら空）だけを表示する */
    .current-chat-portrait {
      flex: 0 0 220px;
      height: 100%;
      background-color: #111;
      background-size: contain;
      background-position: bottom center;
      background-repeat: no-repeat;
    }

    .current-chat-log {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    .current-chat-log-item {
      font-size: 1.05rem;
      color: #ddd;
      animation: fadeIn 0.3s ease-out;
    }

    /* ダイス結果等の本文。通常のログでは1.1rem、カレントチャット欄では
       最新発言1件だけを大きく見せたいのでさらに拡大する */
    .log-result-text {
      font-size: 1.1rem;
    }

    .current-chat-log-item .log-result-text {
      font-size: 1.4rem;
    }

    #board {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #808080;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 25px 25px, 25px 25px;
      background-position: 0 0, 0 0;
      background-repeat: repeat, repeat;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      transform-origin: 0 0;
    }

    .token {
      width: 25px;
      height: 25px;
      background-color: transparent;
      overflow: hidden;
      border: 2px solid #ffffff;
      border-radius: 10px;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      touch-action: none;
      z-index: 10;
      transition: top 0.05s ease-out, left 0.05s ease-out;
      flex-direction: column;
      justify-content: flex-end;
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: none;
    }

    /* コマ画像。内側に敷き、トリミング設定(object-position/transform)で見え方を変える。
       名前(.token-name)より下に来るよう、名前側にz-indexを持たせている。 */
    .token-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      
    }

    .token-name {
      position: relative;
      z-index: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      text-align: center;
      width : 100%;
    }

    /* パネルの重なり層。パネル同士の重なり順（.panel-objectのz-index、js/board-data-driven.jsが
       state.panels[].stackOrderから決める）をここで閉じ込める。層自身がz-index:5を持つので、
       中で何番を付けてもコマ(.token, z-index:10)やダイス(.dice-stage, z-index:40)より前には出ない。
       素通し(pointer-events:none)にして、パネルの無いところの左ドラッグ（盤面パン）と
       右クリック（盤面メニュー）は今までどおり下の#boardへ届くようにする。 */
    #panel-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* パネル：コマの下に敷くマップタイル状オブジェクト（盤面上／盤面外に配置可能） */
    .panel-object {
      position: absolute;
      /*background-color: rgba(255, 255, 255, 0.06);*/
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 0px dashed rgba(255, 255, 255, 0.35);
      box-sizing: border-box;
      cursor: grab;
      touch-action: none;
      /* 親(#panel-layer)が素通しなので、パネル自身で操作を拾い直す */
      pointer-events: auto;
    }

    .panel-object:active {
      cursor: grabbing;
    }

    /* 固定中のパネル：ドラッグ移動できない（背景タイル扱い）。実線枠と通常カーソルで示す */
    .panel-object.locked {
      cursor: default;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .panel-object.locked:active {
      cursor: default;
    }

    /* カード（表と裏を持つ盤面オブジェクト）とデッキ（その束）。
       パネルと同じ#panel-layerに入り、同じstackOrderの物差しで前後が決まる
       （js/board-data-driven.jsのSTATE_CHANGED）。層のz-indexにより、どちらも
       コマ(.token)より手前には出ない。 */
    .card-object,
    .deck-object {
      position: absolute;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.55);
      background-color: #f7f5ef; /* 画像が無いときの表面（紙の色） */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      /* 親(#panel-layer)が素通しなので、自身で操作を拾い直す（.panel-objectと同じ） */
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .card-object:active,
    .deck-object:active {
      cursor: grabbing;
    }

    /* 裏向きのカードとデッキ：画像が無くても「裏」と分かる無地の柄にする。
       表面の情報（スート・数字）はDOMにも出さない（js/board-data-driven.js）。 */
    .card-object.face-down,
    .deck-object {
      background-color: #2a3f6b;
      background-image:
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.08) 0 6px, transparent 6px 12px);
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* 表面・裏面の画像。無い／読み込めないときはJS側が隠し、下のテキストが見える。 */
    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 画像が無いときに出るカード名（トランプならスートと数字）。画像があるときはその下に隠れる。
       カードの幅は4マス（100px）しかないので、長い名前は折り返して小さく出す
       （段階の切り替えはjs/board-data-driven.jsのcardTextSizeClass）。 */
    .card-text {
      position: absolute;
      left: 4px;
      right: 4px;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .card-text.len-m {
      font-size: 15px;
    }

    .card-text.len-l {
      font-size: 11px;
    }

    /* 固定中のカード・デッキ：パネルと同じく実線枠と通常カーソルで示す */
    .card-object.locked,
    .deck-object.locked {
      cursor: default;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.75);
    }

    .card-object.locked:active,
    .deck-object.locked:active {
      cursor: default;
    }

    /* デッキ名（上）と残り枚数（下）。札の絵の上に重ねる。 */
    .deck-name,
    .deck-count {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .deck-name {
      top: 4px;
      font-size: 12px;
      padding: 0 2px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .deck-count {
      bottom: 4px;
      font-size: 18px;
      font-weight: bold;
    }

    /* 空になったデッキ：引けないことがひと目で分かるよう薄くする（消しはしない。
       シャッフルし直して使う・あとで札を戻す、という運用の余地を残すため）。 */
    .deck-object.empty {
      opacity: 0.4;
    }

    /* 「カードを見る」ダイアログの中身（js/deck-dialog.jsのshowCardPeekDialog）。
       盤面のカードと同じ縦横比(4:6マス)を保ったまま大きく出す。 */
    .card-peek {
      position: relative;
      width: 160px;
      height: 240px;
      margin: 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #f7f5ef;
      overflow: hidden;
    }

    .card-peek-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-peek-text {
      position: absolute;
      left: 8px;
      right: 8px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      overflow-wrap: anywhere;
      color: #1b1b1b;
    }

    /* 「カードを見る」で出すカード情報（face.info）。カードの絵の下に本文として置く。 */
    .card-peek-info {
      margin: 0 0 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ddd;
      font-size: 0.9rem;
    }

    /* ログ＋チャット欄の縦並び。高さの配分は固定で、ここ自体はスクロールしない。
       スクロールするのは中のログ（.log-container）だけ。
       以前は境目をドラッグして高さを変えられたが（3分割だった頃の名残）、各段に
       固定pxが入る仕組みだったため、合計が枠に収まらないとここに縦スクロールバーが
       出てしまっていた（画面の右端に出る、誰も頼んでいないバーの正体）。 */
    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
      overflow: hidden;
    }

    /* チャット送信欄。中身（選択欄・入力欄・記入中の表示）の高さそのままで下に置く */
    .chat-send-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 0 auto;
      min-height: 0;
    }

    /* チャット欄：ゲームシステム/参照キャラクターの選択は小さく横並びにする */
    .chat-input-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input-selects {
      display: flex;
      gap: 6px;
    }

    .compact-select {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font-size: 0.75rem;
    }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      position: relative;
    }

    /* チャット欄の予測変換候補。commandInputの直上に重ねて出す（見た目はチャットパレットの
       行一覧・.chat-palette-listに合わせ、新しい色は定義しない） */
    .chat-input-suggestions {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      margin-bottom: 4px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #1e1e1e;
      z-index: 20;
    }

    .chat-input-row textarea {
      flex: 1;
      min-width: 0;
      resize: vertical;
      font-family: inherit;
      line-height: 1.4;
    }

    .chat-input-row .btn-send {
      width: auto;
      flex-shrink: 0;
      align-self: stretch;
      padding: 8px 16px;
    }

    /* 記入中の参加者一覧（T-013）。チャット入力欄の右下に小さく出す。誰も記入中でなければ
       hidden属性で領域ごと消し、空の枠を残さない。 */
    .typing-indicator {
      text-align: right;
      font-size: 0.75rem;
      color: #999;
    }

    /* 移動・拡縮できる浮動パネル（js/floating-panel.js）。枠と操作だけを持つ汎用スタイルで、
       中身（チャットパレット・情報・キャラクター一覧）はそれぞれのクラスが持つ */
    .floating-panel {
      position: fixed;
      z-index: 60;
      display: flex;
      flex-direction: column;
      background-color: #262626;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      box-sizing: border-box;
    }

    .floating-panel-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background-color: #333;
      border-bottom: 1px solid #444;
      cursor: move;
      /* ドラッグ移動はPointer Eventsで自前処理する（js/floating-panel.js）。
         これが無いとタッチではブラウザのスクロールに指を持っていかれる。 */
      touch-action: none;
    }

    .floating-panel-title {
      flex: 1;
      min-width: 0;
      font-size: 0.85rem;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .floating-panel-close {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 4px;
    }

    .floating-panel-close:hover {
      background-color: #4a3a3a;
      color: #fff;
    }

    .floating-panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 右下の拡縮つまみ。斜線2本で掴める場所であることを示す */
    .floating-panel-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      touch-action: none;
      background:
        linear-gradient(135deg, transparent 0 45%, #666 45% 55%, transparent 55% 100%),
        linear-gradient(135deg, transparent 0 70%, #666 70% 80%, transparent 80% 100%);
    }

    /* チャットパレット：保存フレーズを1行1つで並べ、行のクリックだけで送信できる */
    .chat-palette {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-palette-tabs {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .chat-palette-tab {
      background-color: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px 4px 0 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-palette-tab.is-active {
      background-color: #444;
      color: #fff;
      border-color: #777;
    }

    .chat-palette-tab-add,
    .chat-palette-tab-remove {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .chat-palette-tab-add:hover,
    .chat-palette-tab-remove:hover:not(:disabled) {
      background-color: #3a3a3a;
    }

    .chat-palette-tab-remove:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .chat-palette-name-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-palette-name {
      flex: 1;
      min-width: 0;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.8rem;
    }

    /* 入力した名前がコマ名と一致しているか（＝そのコマとして送るか）をその場で示す */
    .chat-palette-name-status {
      flex: 0 0 auto;
      font-size: 0.7rem;
      color: #666;
      white-space: nowrap;
    }

    .chat-palette-name-status.is-matched {
      color: #4caf50;
    }

    .chat-palette-name-status.is-plain {
      color: #c9a227;
    }

    .chat-palette-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #1e1e1e;
    }

    /* メモ帳のような1行1フレーズの並び。長い行は折り返さず横スクロールさせる */
    .chat-palette-line {
      padding: 3px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: #ddd;
      white-space: pre;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
    }

    .chat-palette-line:hover {
      background-color: #33405a;
      color: #fff;
    }

    .chat-palette-empty {
      color: #666;
      font-size: 0.8rem;
      margin: 0;
      padding: 6px 8px;
    }

    .chat-palette-editor {
      flex: 1;
      min-height: 0;
      background-color: #1e1e1e;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      resize: none;
      box-sizing: border-box;
    }

    .chat-palette-send-row {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      align-items: stretch;
    }

    .chat-palette-send-input {
      flex: 1;
      min-width: 0;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.8rem;
      resize: none;
      box-sizing: border-box;
    }

    .chat-palette-send-btn {
      flex: 0 0 auto;
      background-color: #007acc;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chat-palette-send-btn:hover {
      background-color: #0a8ae0;
    }

    .chat-palette-footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .chat-palette-footer-btn {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .chat-palette-footer-btn:hover {
      background-color: #3a3a3a;
    }

    /* 情報パネル：タイトル＋内容の組をタブで並べる共有メモ（js/info-panel.js）。
       枠と移動・拡縮は汎用の.floating-panelが持ち、ここは中身だけを受け持つ
       （チャットパレットと同じ構成なので、見た目もそちらへそろえてある） */
    .info-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .info-panel-tabs {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .info-panel-tab {
      background-color: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px 4px 0 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-panel-tab.is-active {
      background-color: #444;
      color: #fff;
      border-color: #777;
    }

    .info-panel-tab-add {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .info-panel-tab-add:hover {
      background-color: #3a3a3a;
    }

    .info-panel-sections {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #1e1e1e;
      padding: 6px 8px;
    }

    .info-panel-section + .info-panel-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }

    /* 区画の見出し。将来のダブルハンドアウト（表の使命／裏の使命）で使う */
    .info-panel-section-head {
      color: #c9a227;
      font-size: 0.75rem;
      margin-bottom: 3px;
    }

    /* 本文はtextContentで入れるので、改行はここで見せる */
    .info-panel-section-body {
      color: #ddd;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info-panel-empty {
      color: #666;
      font-size: 0.8rem;
      margin: 0;
    }

    .info-panel-footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .info-panel-footer-btn {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .info-panel-footer-btn:hover:not(:disabled) {
      background-color: #3a3a3a;
    }

    .info-panel-footer-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ログ／チャット欄／チャットパレットの高さをユーザーがドラッグで調整するためのハンドル */
    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"], textarea {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    /* チャット欄を置いた残り全部を取る。min-height:0が無いと、中のログが伸びた分だけ
       この段も伸びて親からはみ出す（flexの既定はmin-height:auto＝縮まない） */
    .log-section {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* タブ列（横スクロールする）と、その外に固定する「？ヘルプ」を並べる行 */
    .chat-tabs-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 6px;
    }

    .chat-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
    }

    .chat-tab {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 0 0 4px 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chat-tab:hover {
      background-color: #333;
      color: #fff;
    }

    .chat-tab.active {
      background-color: #007acc;
      color: #fff;
      border-color: #007acc;
    }

    .chat-tab-add {
      background: none;
      color: #888;
      border: 1px dashed #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-tab-add:hover {
      color: #fff;
      border-color: #007acc;
    }

    /* 「？ヘルプ」タブ。他のタブと違い、選んでいなくても黄色くしておく
       （「困ったらここ」の目印なので、探させたくない） */
    .chat-tab-help {
      background-color: #f0c419;
      color: #2a2a2a;
      border-color: #c99f0a;
      font-weight: bold;
    }

    .chat-tab-help:hover {
      background-color: #ffd633;
      color: #2a2a2a;
    }

    /* .chat-tab.active が color:#fff を持っているので、ここで打ち消しておく
       （黄色地に白文字だと読めない） */
    .chat-tab-help.active {
      background-color: #ffd633;
      color: #2a2a2a;
      border-color: #fff0a0;
      box-shadow: inset 0 0 0 1px #fff0a0;
    }

    /* --- ヘルプの対話（js/help/help-panel.js）。枠はログ欄と同じ見た目に揃える --- */
    .help-chat {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .help-chat-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      animation: fadeIn 0.3s ease-out;
    }

    .help-chat-row.is-user {
      justify-content: flex-end;
    }

    .help-avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #fff;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .help-bubble {
      background-color: #2f2f2f;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      max-width: 80%;
    }

    .help-chat-row.is-user .help-bubble {
      background-color: #0b5f96;
    }

    .help-paragraph {
      margin: 0 0 6px 0;
      white-space: pre-wrap;
    }

    .help-paragraph:last-child {
      margin-bottom: 0;
    }

    /* 選択肢。アバターぶん下げてボットの発言にぶら下がって見えるようにする */
    .help-choices {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      margin: 0 0 10px 48px;
    }

    .help-choice {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #f0c419;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: left;
    }

    .help-choice:hover {
      background-color: #3a3a3a;
    }

    /* 戻る導線は本題の選択肢と区別が付くよう色を落とす */
    .help-choice.is-back {
      border-color: #555;
      color: #bbb;
    }

    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .character-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #333;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .character-avatar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .character-avatar {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #fff;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .character-avatar-initiative {
      position: absolute;
      top: -4px;
      left: -4px;
      min-width: 14px;
      height: 14px;
      padding: 0 2px;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-avatar-name {
      font-size: 0.65rem;
      color: #bbb;
      max-width: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .context-menu {
      position: fixed;
      z-index: 1000;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      min-width: 140px;
      overflow: hidden;
      padding: 4px;
    }

    .context-menu-item {
      background: none;
      border: none;
      color: #e0e0e0;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .context-menu-item:hover {
      background-color: #3a3a3a;
    }

    /* 権限が無くてできない操作（他人のコマの更新など）。項目自体は残して、
       できないことと理由（title属性）が分かるようにする */
    .context-menu-item:disabled {
      color: #777;
      cursor: not-allowed;
    }

    .context-menu-item:disabled:hover {
      background: none;
    }

    .context-menu-item.danger:hover {
      background-color: #a8323f;
      color: #fff;
    }

    /* ======================================================================
       指で操作する環境（タッチ・ペン）。画面幅とは独立に、当たり判定だけを広げる。
       タッチ対応ノートPCも該当するが、押しやすくなるだけで害は無い。
       ====================================================================== */
    @media (pointer: coarse) {
      /* 指で正確に狙える下限とされる44px前後まで持ち上げる */
      .room-menu-btn {
        width: 44px;
        height: 44px;
      }

      .context-menu-item {
        padding: 12px 16px;
        font-size: 1rem;
      }

      .floating-panel-resize {
        width: 28px;
        height: 28px;
      }

      .chat-tab,
      .chat-tab-add,
      .help-choice {
        padding: 8px 12px;
      }
    }

    /* ======================================================================
       狭幅（スマホ）レイアウト。
       ヘッダー／中央スペース／切り替えタブ／ログ／チャット入力 の縦5段にする。
       DOMの組み替えはjs/mobile-layout.jsが行い、ここは見た目だけを持つ。
       ====================================================================== */
    @media (max-width: 900px) {
      body {
        padding: 0;
        /* 横向きのiPhoneではノッチが画面の左右に来る。上下（padding-top/bottom）を
           足さないのは、ステータスバーをblack（不透過）にしてあるぶん縦は食い込まず、
           下端はチャット欄側の.chat-send-panelがすでにホームバーを避けているため。 */
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* 上部は「タイトルとメニューだけの細い帯」に徹して、残りを全部中央スペースへ渡す */
      .app-header {
        gap: 8px;
        padding: 2px 8px;
        margin-bottom: 0;
        border-bottom-width: 1px;
        box-sizing: border-box;
      }

      h1 {
        font-size: 1rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 部屋名は⋮のルーム設定から確認できる。狭い1行を取り合わせない */
      .room-name-label {
        display: none;
      }

      .app-container,
      .main-area {
        gap: 0;
      }

      .main-area {
        flex-direction: column;
      }

      /* 中央スペース：盤面・チャット・キャラ一覧・チャットパレット・情報を重ねて置き、
         .is-activeの1つだけを見せる */
      #mobileStage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      #mobileStage > * {
        display: none;
      }

      #mobileStage > .is-active {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      /* 浮動パネルは中央スペースいっぱいに広げる。!importantが要るのは、
         PC幅で動かしたときにjs/floating-panel.jsが書いたインラインの位置・大きさが
         残っているため（dock中は新たに書かれない。PC幅へ戻ればそのまま復帰する）。 */
      #mobileStage > .floating-panel {
        position: static !important;
        left: auto !important;
        top: auto !important;
        width: auto !important;
        height: auto !important;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }

      /* はめ込み中はヘッダーがただの見出しになる（移動できないので） */
      .floating-panel.is-docked .floating-panel-header {
        cursor: default;
      }

      .floating-panel.is-docked .floating-panel-resize {
        display: none;
      }

      #mobileStageTabs {
        flex: 0 0 auto;
        display: flex;
        gap: 4px;
        padding: 4px 6px;
        background-color: #222;
        border-top: 1px solid #3a3a3a;
        border-bottom: 1px solid #3a3a3a;
        overflow-x: auto;
      }

      /* タブは4枚（盤面/チャット/パレット/キャラ・情報・スタンプの束）。束のタブだけは
         「スタンプ ▾」と中身の名前が入るので、他より少し文字数が要る。 */
      .mobile-stage-tab {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background-color: #2a2a2a;
        color: #aaa;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 10px 2px;
        font-size: 0.8rem;
        white-space: nowrap;
        cursor: pointer;
      }

      .mobile-stage-tab.is-active {
        background-color: #007acc;
        color: #fff;
        border-color: #007acc;
      }

      /* 束のタブには中身の名前が入る。収まらないときは末尾を省略して、
         バッジや他のタブを押し出さない。 */
      .mobile-stage-tab-label {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* チャットタブを見ていない間に増えた発言の件数（js/mobile-layout.js）。
         タブの中に置くので、文字が押し出されないよう縮まない指定にする。 */
      .mobile-stage-tab-badge {
        flex: 0 0 auto;
        background-color: #d9534f;
        color: #fff;
        border-radius: 999px;
        padding: 0 5px;
        font-size: 0.7rem;
        font-weight: bold;
        line-height: 1.5;
      }

      .mobile-stage-tab.is-active .mobile-stage-tab-badge {
        background-color: #fff;
        color: #007acc;
      }

      /* PC用のheight:100%は、中央スペース（flexの縦並び）の中では余計な高さになる */
      .board-area {
        gap: 6px;
        height: auto;
      }

      /* ラウンド進行バーはボタンとニックネームが折り返して縦に伸び、狭幅では
         中央スペースの4割以上を占める。盤面に高さを譲るため詰める。 */
      .round-panel-bar {
        gap: 6px;
        padding: 4px 8px;
      }

      .round-panel-btn {
        padding: 5px 8px;
        font-size: 0.8rem;
      }

      /* 手番一覧は折り返さず横スクロールで見る（縦に伸びると盤面が潰れるため） */
      .round-panel-detail {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 4px 8px;
      }

      .round-panel-turn-row {
        flex: 0 0 auto;
      }

      /* 盤面の下1/4に出していた立ち絵＋最新発言。下段のログ表示と中身が重なるうえ
         縦を大きく食うので、狭幅では盤面に高さを譲る。 */
      .current-chat-bar {
        display: none;
      }

      /* チャット（ログ＋入力欄）も中央スペースの1ビュー。開いている間は全面を使い、
         ログが伸びて入力欄が下に付く。高さの配分そのものはPC幅と同じ（.log-sectionが
         残り全部、.chat-send-panelは中身の高さ）なので、ここで上書きするのは
         余白と高さの取り方だけでよい。 */
      .control-area {
        min-width: 0;
        height: auto;
        gap: 6px;
        overflow: hidden;
        padding: 6px;
        box-sizing: border-box;
      }

      .panel {
        padding: 8px;
      }

      /* 指で文字を打つ欄は16pxまで上げる。読みやすさのためと、iOS Safariが16px未満の
         入力欄で勝手に画面を拡大するのを避けるため（viewportのmaximum-scale=1.0でも
         塞いでいるが、こちらは素の読みやすさの話）。
         クラス指定（.chat-palette-*は0.8rem）を上書きするので、同じ強さで並べる。 */
      #commandInput,
      .chat-palette-editor,
      .chat-palette-send-input,
      .chat-palette-name {
        font-size: 16px;
      }

      .chat-input-row textarea {
        resize: none;
      }

      /* ホームバー／ジェスチャ領域に送信ボタンが潜り込まないようにする */
      .chat-send-panel {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* 浮動パネルの初期位置はPC幅前提なので、はめ込む前に一瞬はみ出して
         横スクロールが出ることがある。狭幅では常に切っておく。 */
      body {
        overflow-x: hidden;
      }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🎲 もじゅらX</h1>
    <span id="roomNameLabel" class="room-name-label"></span>
    <span id="netStatus" class="net-status net-status-connecting">● 接続中...</span>
    <button id="audioMenuBtn" class="room-menu-btn" title="音楽" type="button">♪</button>
    <button id="roomMenuBtn" class="room-menu-btn" title="ルームメニュー" type="button">⋮</button>
  </div>

  <dialog id="roomSettingsDialog" class="character-dialog">
    <form method="dialog">
      <h3>ルーム設定</h3>
      <!-- GM以外には一部の項目を押せない状態で出す（js/main.jsのapplyGmOnlyControls） -->
      <p id="roomSettingsGmNote" class="audio-note" hidden>
        システム・プラグインの変更、入室パスワードの変更、セッションデータの読み込み、部屋の削除はGMだけが行えます。
      </p>
      <div class="dialog-form-group">
        <label for="roomNameInput">部屋名</label>
        <input type="text" id="roomNameInput">
      </div>
      <div class="dialog-form-group">
        <label for="gameSystem">BCDiceのシステム</label>
        <!-- 選択肢はBCDiceのAPIから取得して埋める（js/bcdice-catalog.js） -->
        <div class="game-system-row">
          <select id="gameSystem"></select>
          <button type="button" id="gameSystemHelpBtn" class="game-system-help-btn"
                  aria-label="このシステムのヘルプ" aria-describedby="gameSystemHelp">？</button>
          <div id="gameSystemHelp" class="game-system-help" role="tooltip" hidden></div>
        </div>
      </div>
      <div class="dialog-form-group">
        <label for="roomPluginSelect">ルームのプラグイン</label>
        <select id="roomPluginSelect"></select>
      </div>
      <!-- ラウンド進行の設定（js/game-store.jsのSET_ROUND_SETTINGS）。ルーム単位・全員共通で、
           進行中に切り替えた場合は次に手番が決まるタイミングから効く -->
      <div class="dialog-form-group">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"
               title="各キャラクターの手番の直前に「イニシアチブプロセス」を挟み、その都度イニシアチブ順を計算し直します。">
          <input type="checkbox" id="roundInitiativeProcessCheck">
          キャラクターの手番の前にイニシアチブプロセスを挟む
        </label>
      </div>
      <!-- 入室メッセージ（js/game-store.jsのSET_SHOW_ENTRY_MESSAGES）。ルーム単位・全員共通で、
           上のイニシアチブ設定と同じ権限判定（canOperateAsGm）で操作可否を決める -->
      <div class="dialog-form-group">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"
               title="部屋に入室したとき、既定のチャットタブ（Main）へ「〈名前〉が入室しました。」を表示します。">
          <input type="checkbox" id="showEntryMessagesCheck">
          入室メッセージを表示する
        </label>
      </div>
      <!-- 入室パスワード。現在の値はサーバーに平文で残っていないため表示できない。
           空欄で「変更」を押すと解除になる（js/main.jsのapplyEntryPassword） -->
      <div class="dialog-form-group">
        <label for="entryPasswordInput">入室パスワード（空欄にして変更すると解除）</label>
        <div class="dialog-button-row">
          <input type="password" id="entryPasswordInput" maxlength="64" placeholder="新しいパスワード">
          <button type="button" id="entryPasswordBtn" class="dialog-confirm-btn">変更</button>
        </div>
        <p id="entryPasswordNote" class="audio-note"></p>
      </div>

      <label style="margin-top: 8px; display: block;">セッションデータ</label>
      <div class="dialog-button-row">
        <button type="button" id="exportStateBtn" class="dialog-confirm-btn">ファイルに保存</button>
        <button type="button" id="importStateBtn" class="dialog-confirm-btn">ファイルから読み込み</button>
        <input type="file" id="importStateInput" accept="application/json" style="display: none;">
      </div>
      <div class="dialog-button-row" style="margin-top: 16px;">
        <button type="submit" class="dialog-confirm-btn">閉じる</button>
      </div>
      <div class="dialog-button-row" style="margin-top: 24px;">
        <button type="button" id="deleteRoomBtn" class="dialog-danger-btn">部屋を削除</button>
      </div>
    </form>
  </dialog>
  <div class="app-container">
  <!-- 既存の盤面＋コントロールを、新しいラッパーで囲む -->
  <div class="main-area">
    <!-- キャラクター一覧は浮動パネル（js/character-panel.js）。body直下に動的生成するので
         ここにmarkupは無い -->
    <div class="board-area">
      <!-- ラウンド進行（Core機能）の常時表示ステータスバー。js/round-panel.js参照 -->
      <div class="round-panel-bar" id="roundPanelBar" style="display: none;">
        <span class="round-panel-status" id="roundPanelStatus">ラウンド進行前</span>
        <span class="round-panel-nickname" id="roundPanelNicknameLabel"></span>
        <button type="button" id="roundPanelReadyToggleBtn" class="round-panel-btn">割り込みなし</button>
        <button type="button" id="roundPanelActionBtn" class="round-panel-btn round-panel-action-btn">ラウンド進行を開始</button>
        <button type="button" id="roundPanelMenuBtn" class="round-panel-btn" title="参加者編集・終了">⋮</button>
        <div class="round-panel-ready-list" id="roundPanelReadyList"></div>
        <!-- プロット（kind:'plot'のフェーズ）の提出欄と提出状況。中身はjs/round-panel.jsが組む -->
        <div class="round-panel-plot" id="roundPanelPlot" style="display: none;"></div>
      </div>
      <div class="round-panel-detail" id="roundPanelDetail" style="display: none;"></div>

      <div id="board-viewport">
        <div id="board">
          <!-- パネルの置き場（js/board-data-driven.js）。コマは#board直下に足されるので、
               この層を挟むことでパネルの重なり順がコマを追い越さないようにしている -->
          <div id="panel-layer"></div>
        </div>
        <!-- 3Dダイスの舞台（js/dice-animation.js）。中のcanvasはライブラリが作る -->
        <div id="dice-stage" class="dice-stage" aria-hidden="true"></div>
        <!-- スタンプの置き場（js/stamp-layer.js）。盤面の右上に重ねる。
             盤面の操作を邪魔しないよう pointer-events は通す -->
        <div id="stampLayer" aria-hidden="true"></div>
      </div>

      <!-- 盤面下1/4：既存ログのミラー表示。左側（キャラ一覧パネルと重なりうる領域）は
           チャット表示を置かず、直近に発言した参照キャラクターの立ち絵表示に充てる -->
      <div class="current-chat-bar" id="currentChatBar">
        <div class="current-chat-portrait" id="currentChatPortrait"></div>
        <div class="current-chat-log" id="currentChatLog"></div>
      </div>
    </div>

    <div class="control-area" id="controlArea">
      <!-- 上段：ログ＋チャットタブ。タブは入力欄に近い下側に置く -->
      <div class="log-section">
        <div class="log-container" id="logContainer">
          <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
        </div>
        <!-- ヘルプの対話（js/help/help-panel.js）。ログ欄を上書きせず入れ替える：
             logContainerは差分追記でログを描いているので、中身を横取りすると
             その計数が壊れる -->
        <div class="help-chat" id="helpChat" hidden></div>
        <!-- 「？ヘルプ」はスクロールするタブ列（#chatTabs）の外に置く。タブが増えても
             流れず右端に居座り、renderChatTabsのinnerHTML=''にも巻き込まれない -->
        <div class="chat-tabs-row">
          <div class="chat-tabs" id="chatTabs"></div>
          <button type="button" class="chat-tab chat-tab-help" id="helpTabBtn" title="使い方のヘルプ">？ヘルプ</button>
        </div>
      </div>

      <!-- 下段：チャット送信欄。高さは中身なりで、上のログが残りを取る -->
      <div class="chat-send-panel">
        <div class="panel chat-input-panel">
          <div class="chat-input-selects">
            <select id="characterParamSelect" class="compact-select" title="参照キャラクター（{パラメータ名}の置換・送信元）">
              <option value="">（選択なし）</option>
            </select>
          </div>
          <div class="chat-input-row">
            <textarea id="commandInput" rows="3" placeholder="CC(45) 隠れます／{HP}／+侵蝕率(10)"></textarea>
            <div id="commandInputSuggestions" class="chat-input-suggestions" style="display:none;"></div>
            <button class="btn-send" id="sendBtn">送信</button>
          </div>
          <!-- 他の参加者の記入中一覧（T-013）。js/main.jsがTYPING_USERS_CHANGEDを受けて描画する -->
          <div id="typingIndicator" class="typing-indicator" hidden></div>
        </div>
      </div>
    </div>
  </div>

</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
