<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もじゅらX</title>
  <link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
  <link rel="stylesheet" href="/css/character-dialog.css">
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin: 0;
      flex: 1;
    }

    .net-status {
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .room-name-label {
      color: #999;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .net-status-connected {
      color: #4caf50;
    }

    .net-status-connecting {
      color: #e0a020;
    }

    .net-status-disconnected {
      color: #e05252;
    }

    .room-menu-btn {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .room-menu-btn:hover {
      background-color: #3a3a3a;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 75px);
      gap: 20px;
      box-sizing: border-box;
    }
    /* ダイアログ/エフェクト・コンボ/能力技能ボックス/DX3拡張パネルのCSSは
       css/character-dialog.css へ移動（character-builder.htmlと共有するため） */

    /* キャラクター一覧のパラメータ表示 */
    .character-param-list {
      margin-top: 4px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .character-param-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #bbb;
    }

    /* キャラクター一覧パネル専用（ルーム変数一覧とは見た目を分ける） */
    .character-list-param-row {
      display: grid;
      grid-template-columns: 4.4em 1fr;
      column-gap: 8px;
      font-size: 0.8rem;
      color: #bbb;
      /* ラベル（日本語）と値（数字）は別のグリッドアイテムなので、line-height:normalのままだと
         それぞれが自分の実フォント（日本語はフォールバック）の行の高さになり、同じ行の中で
         ベースラインが3pxほどずれる（行の高さも15px/19pxと不揃いになる）。行の高さを明示して
         両方のベースラインを揃える。 */
      line-height: 1.4;
    }

    .character-param-label {
      color: #2ecc71;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .character-param-value {
      text-align: left;
    }
/* キャラクター一覧：浮動パネル（js/character-panel.js）の中身。盤面のコマと
   バックヤードのコマをタブで切り替えて並べる。枠と移動/拡縮は.floating-panel側。 */
    .character-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .character-panel-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .character-panel-tab {
      background-color: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px 4px 0 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .character-panel-tab.is-active {
      background-color: #444;
      color: #fff;
      border-color: #777;
    }

    .character-panel-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .character-panel-empty {
      color: #888;
      font-size: 0.8rem;
      margin: 4px 2px;
    }

    /* バックヤードタブの「盤面に戻す」。行の右端へ寄せる */
    .character-panel-restore-btn {
      margin-left: auto;
      flex-shrink: 0;
      background-color: #3a3a3a;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .character-panel-restore-btn:hover {
      background-color: #4a4a4a;
      color: #fff;
    }

/* 盤面＋コントロールのコンテナ */
    .main-area {
      position: relative;
      flex: 1;
      display: flex;
      gap: 20px;
      height: 100%;
      min-width: 0; /* flexアイテムが縮まないバグを防止 */
    }

    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #board-viewport {
      position: relative;
      width: 100%;
      flex: 3;
      min-height: 0;
      overflow: hidden; /* パン・ズームしてはみ出た部分をここで切り取る */
      cursor: grab;
    }

    /* 3Dダイスを転がす場所（js/dice-animation.js）。盤面にぴったり重ね、盤面外へは出さない。
       ダイスは駒(.token, z-index:10)より手前、浮動パネル(.floating-panel, z-index:60)より奥。
       表示していない間は盤面の操作（パン・ズーム・駒のドラッグ）を邪魔しないよう素通しにする。
       display:noneにしないのは、canvasの大きさが0になってライブラリの初期化に失敗するため。 */
    .dice-stage {
      position: absolute;
      inset: 0;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }

    /* 転がっている間だけ。クリックで消せるようここでポインタを受け取る */
    .dice-stage.is-rolling {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    /* ラウンド進行（Core機能）の常時表示ステータスバー。js/round-panel.js参照 */
    .round-panel-bar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .round-panel-status {
      color: #e0e0e0;
      font-size: 0.9rem;
      font-weight: bold;
      user-select: none;
    }

    .round-panel-nickname {
      color: #999;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    /* 常に単独の行（2行目）を占有させる。1行目（ステータス・ニックネーム・ボタン）と
       混在して折り返し位置が不安定にならないようにするため。 */
    .round-panel-ready-list {
      flex: 1 0 100%;
      color: #ccc;
      font-size: 0.85rem;
    }

    .round-panel-btn {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .round-panel-action-btn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
      border-color: #007acc;
    }

    .round-panel-btn.active {
      background-color: #2e7d32;
      color: #fff;
      border-color: #2e7d32;
    }

    .round-panel-detail {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .round-panel-turn-row {
      background-color: #2a2a2a;
      color: #ccc;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.8rem;
    }

    .round-panel-turn-row.active-turn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
    }

    /* このラウンドで行動を終えたコマ。手番が回ってこないことが一目で分かるよう薄く沈める
       （GMがクリックして「行動済みを解除」すると戻る。js/round-panel.js参照） */
    .round-panel-turn-row.acted {
      color: #777;
      text-decoration: line-through;
      opacity: 0.75;
    }

    /* 次の手番に割り込む予約が入っているコマ */
    .round-panel-turn-row.interrupt-reserved {
      border: 1px solid #d0a000;
      color: #f0c040;
    }

    .round-panel-turn-row.clickable {
      cursor: pointer;
    }

    .round-panel-turn-row.clickable:hover {
      background-color: #3a3a3a;
    }

    /* 盤面下1/4：既存ログのミラー表示エリア */
    .current-chat-bar {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    /* キャラ一覧パネル（オーバーレイ）と重なりうる左側領域。
       通常のログは置かず、直近に発言した参照キャラクターの立ち絵（未設定なら空）だけを表示する */
    .current-chat-portrait {
      flex: 0 0 220px;
      height: 100%;
      background-color: #111;
      background-size: contain;
      background-position: bottom center;
      background-repeat: no-repeat;
    }

    .current-chat-log {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    .current-chat-log-item {
      font-size: 1.05rem;
      color: #ddd;
      animation: fadeIn 0.3s ease-out;
    }

    /* ダイス結果等の本文。通常のログでは1.1rem、カレントチャット欄では
       最新発言1件だけを大きく見せたいのでさらに拡大する */
    .log-result-text {
      font-size: 1.1rem;
    }

    .current-chat-log-item .log-result-text {
      font-size: 1.4rem;
    }

    #board {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #808080;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 25px 25px, 25px 25px;
      background-position: 0 0, 0 0;
      background-repeat: repeat, repeat;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      transform-origin: 0 0;
    }

    .token {
      width: 25px;
      height: 25px;
      background-color: transparent;
      overflow: hidden;
      border: 2px solid #ffffff;
      border-radius: 10px;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
      z-index: 10;
      transition: top 0.05s ease-out, left 0.05s ease-out;
      flex-direction: column;
      justify-content: flex-end;
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: none;
    }

    /* コマ画像。内側に敷き、トリミング設定(object-position/transform)で見え方を変える。
       名前(.token-name)より下に来るよう、名前側にz-indexを持たせている。 */
    .token-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      
    }

    .token-name {
      position: relative;
      z-index: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      text-align: center;
      width : 100%;
    }

    /* パネル：コマの下に敷くマップタイル状オブジェクト（盤面上／盤面外に配置可能） */
    .panel-object {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.06);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      box-sizing: border-box;
      cursor: grab;
      user-select: none;
      z-index: 5;
    }

    .panel-object:active {
      cursor: grabbing;
    }

    /* 固定中のパネル：ドラッグ移動できない（背景タイル扱い）。実線枠と通常カーソルで示す */
    .panel-object.locked {
      cursor: default;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .panel-object.locked:active {
      cursor: default;
    }

    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
      overflow-y: auto;
    }

    /* チャット送信欄＋チャットパレットの統合区画。ログとの間のみリサイズ可能 */
    .chat-send-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    /* チャット欄：ゲームシステム/参照キャラクターの選択は小さく横並びにする */
    .chat-input-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input-selects {
      display: flex;
      gap: 6px;
    }

    .compact-select {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font-size: 0.75rem;
    }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-input-row textarea {
      flex: 1;
      min-width: 0;
      resize: vertical;
      font-family: inherit;
      line-height: 1.4;
    }

    .chat-input-row .btn-send {
      width: auto;
      flex-shrink: 0;
      align-self: stretch;
      padding: 8px 16px;
    }

    /* 移動・拡縮できる浮動パネル（js/floating-panel.js）。枠と操作だけを持つ汎用スタイルで、
       中身（チャットパレット・情報・キャラクター一覧）はそれぞれのクラスが持つ */
    .floating-panel {
      position: fixed;
      z-index: 60;
      display: flex;
      flex-direction: column;
      background-color: #262626;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      box-sizing: border-box;
    }

    .floating-panel-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background-color: #333;
      border-bottom: 1px solid #444;
      cursor: move;
      user-select: none;
    }

    .floating-panel-title {
      flex: 1;
      min-width: 0;
      font-size: 0.85rem;
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .floating-panel-close {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 4px;
    }

    .floating-panel-close:hover {
      background-color: #4a3a3a;
      color: #fff;
    }

    .floating-panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 右下の拡縮つまみ。斜線2本で掴める場所であることを示す */
    .floating-panel-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      background:
        linear-gradient(135deg, transparent 0 45%, #666 45% 55%, transparent 55% 100%),
        linear-gradient(135deg, transparent 0 70%, #666 70% 80%, transparent 80% 100%);
    }

    /* チャットパレット：保存フレーズを1行1つで並べ、行のクリックだけで送信できる */
    .chat-palette {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-palette-tabs {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .chat-palette-tab {
      background-color: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px 4px 0 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-palette-tab.is-active {
      background-color: #444;
      color: #fff;
      border-color: #777;
    }

    .chat-palette-tab-add,
    .chat-palette-tab-remove {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .chat-palette-tab-add:hover,
    .chat-palette-tab-remove:hover:not(:disabled) {
      background-color: #3a3a3a;
    }

    .chat-palette-tab-remove:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .chat-palette-name-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-palette-name {
      flex: 1;
      min-width: 0;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.8rem;
    }

    /* 入力した名前がコマ名と一致しているか（＝そのコマとして送るか）をその場で示す */
    .chat-palette-name-status {
      flex: 0 0 auto;
      font-size: 0.7rem;
      color: #666;
      white-space: nowrap;
    }

    .chat-palette-name-status.is-matched {
      color: #4caf50;
    }

    .chat-palette-name-status.is-plain {
      color: #c9a227;
    }

    .chat-palette-list {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #1e1e1e;
    }

    /* メモ帳のような1行1フレーズの並び。長い行は折り返さず横スクロールさせる */
    .chat-palette-line {
      padding: 3px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: #ddd;
      white-space: pre;
      cursor: pointer;
      border-bottom: 1px solid #2a2a2a;
    }

    .chat-palette-line:hover {
      background-color: #33405a;
      color: #fff;
    }

    .chat-palette-empty {
      color: #666;
      font-size: 0.8rem;
      margin: 0;
      padding: 6px 8px;
    }

    .chat-palette-editor {
      flex: 1;
      min-height: 0;
      background-color: #1e1e1e;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      resize: none;
      box-sizing: border-box;
    }

    .chat-palette-send-row {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      align-items: stretch;
    }

    .chat-palette-send-input {
      flex: 1;
      min-width: 0;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 0.8rem;
      resize: none;
      box-sizing: border-box;
    }

    .chat-palette-send-btn {
      flex: 0 0 auto;
      background-color: #007acc;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chat-palette-send-btn:hover {
      background-color: #0a8ae0;
    }

    .chat-palette-footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .chat-palette-footer-btn {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .chat-palette-footer-btn:hover {
      background-color: #3a3a3a;
    }

    /* 情報パネル：タイトル＋内容の組をタブで並べる共有メモ（js/info-panel.js）。
       枠と移動・拡縮は汎用の.floating-panelが持ち、ここは中身だけを受け持つ
       （チャットパレットと同じ構成なので、見た目もそちらへそろえてある） */
    .info-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .info-panel-tabs {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .info-panel-tab {
      background-color: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 4px 4px 0 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-panel-tab.is-active {
      background-color: #444;
      color: #fff;
      border-color: #777;
    }

    .info-panel-tab-add {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .info-panel-tab-add:hover {
      background-color: #3a3a3a;
    }

    .info-panel-sections {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #1e1e1e;
      padding: 6px 8px;
    }

    .info-panel-section + .info-panel-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }

    /* 区画の見出し。将来のダブルハンドアウト（表の使命／裏の使命）で使う */
    .info-panel-section-head {
      color: #c9a227;
      font-size: 0.75rem;
      margin-bottom: 3px;
    }

    /* 本文はtextContentで入れるので、改行はここで見せる */
    .info-panel-section-body {
      color: #ddd;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info-panel-empty {
      color: #666;
      font-size: 0.8rem;
      margin: 0;
    }

    .info-panel-footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .info-panel-footer-btn {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .info-panel-footer-btn:hover:not(:disabled) {
      background-color: #3a3a3a;
    }

    .info-panel-footer-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ログ／チャット欄／チャットパレットの高さをユーザーがドラッグで調整するためのハンドル */
    .resize-handle {
      flex: 0 0 10px;
      cursor: row-resize;
      position: relative;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      left: 25%;
      right: 25%;
      top: 4px;
      height: 2px;
      background-color: #444;
      border-radius: 1px;
    }

    .resize-handle:hover::after,
    .resize-handle.dragging::after {
      background-color: #007acc;
    }

    .panel {
      /*background-color: #2a2a2a;*/
      padding: 15px;
      /*border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);*/
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"], textarea {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .log-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .chat-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 6px;
      overflow-x: auto;
    }

    .chat-tab {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 0 0 4px 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chat-tab:hover {
      background-color: #333;
      color: #fff;
    }

    .chat-tab.active {
      background-color: #007acc;
      color: #fff;
      border-color: #007acc;
    }

    .chat-tab-add {
      background: none;
      color: #888;
      border: 1px dashed #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-tab-add:hover {
      color: #fff;
      border-color: #007acc;
    }

    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .character-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #333;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .character-avatar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .character-avatar {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #fff;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .character-avatar-initiative {
      position: absolute;
      top: -4px;
      left: -4px;
      min-width: 14px;
      height: 14px;
      padding: 0 2px;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-avatar-name {
      font-size: 0.65rem;
      color: #bbb;
      max-width: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .context-menu {
      position: fixed;
      z-index: 1000;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      min-width: 140px;
      overflow: hidden;
      padding: 4px;
    }

    .context-menu-item {
      background: none;
      border: none;
      color: #e0e0e0;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .context-menu-item:hover {
      background-color: #3a3a3a;
    }

    /* 権限が無くてできない操作（他人のコマの更新など）。項目自体は残して、
       できないことと理由（title属性）が分かるようにする */
    .context-menu-item:disabled {
      color: #777;
      cursor: not-allowed;
    }

    .context-menu-item:disabled:hover {
      background: none;
    }

    .context-menu-item.danger:hover {
      background-color: #a8323f;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🎲 もじゅらX</h1>
    <span id="roomNameLabel" class="room-name-label"></span>
    <span id="netStatus" class="net-status net-status-connecting">● 接続中...</span>
    <button id="audioMenuBtn" class="room-menu-btn" title="音楽" type="button">♪</button>
    <button id="roomMenuBtn" class="room-menu-btn" title="ルームメニュー" type="button">⋮</button>
  </div>

  <dialog id="roomSettingsDialog" class="character-dialog">
    <form method="dialog">
      <h3>ルーム設定</h3>
      <!-- GM以外には一部の項目を押せない状態で出す（js/main.jsのapplyGmOnlyControls） -->
      <p id="roomSettingsGmNote" class="audio-note" hidden>
        システム・プラグインの変更、入室パスワードの変更、セッションデータの読み込み、部屋の削除はGMだけが行えます。
      </p>
      <div class="dialog-form-group">
        <label for="roomNameInput">部屋名</label>
        <input type="text" id="roomNameInput">
      </div>
      <div class="dialog-form-group">
        <label for="gameSystem">BCDiceのシステム</label>
        <!-- 選択肢はBCDiceのAPIから取得して埋める（js/bcdice-catalog.js） -->
        <div class="game-system-row">
          <select id="gameSystem"></select>
          <button type="button" id="gameSystemHelpBtn" class="game-system-help-btn"
                  aria-label="このシステムのヘルプ" aria-describedby="gameSystemHelp">？</button>
          <div id="gameSystemHelp" class="game-system-help" role="tooltip" hidden></div>
        </div>
      </div>
      <div class="dialog-form-group">
        <label for="roomPluginSelect">ルームのプラグイン</label>
        <select id="roomPluginSelect"></select>
      </div>
      <!-- ラウンド進行の設定（js/game-store.jsのSET_ROUND_SETTINGS）。ルーム単位・全員共通で、
           進行中に切り替えた場合は次に手番が決まるタイミングから効く -->
      <div class="dialog-form-group">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"
               title="各キャラクターの手番の直前に「イニシアチブプロセス」を挟み、その都度イニシアチブ順を計算し直します。">
          <input type="checkbox" id="roundInitiativeProcessCheck">
          キャラクターの手番の前にイニシアチブプロセスを挟む
        </label>
      </div>
      <!-- 入室パスワード。現在の値はサーバーに平文で残っていないため表示できない。
           空欄で「変更」を押すと解除になる（js/main.jsのapplyEntryPassword） -->
      <div class="dialog-form-group">
        <label for="entryPasswordInput">入室パスワード（空欄にして変更すると解除）</label>
        <div class="dialog-button-row">
          <input type="password" id="entryPasswordInput" maxlength="64" placeholder="新しいパスワード">
          <button type="button" id="entryPasswordBtn" class="dialog-confirm-btn">変更</button>
        </div>
        <p id="entryPasswordNote" class="audio-note"></p>
      </div>

      <label style="margin-top: 8px; display: block;">セッションデータ</label>
      <div class="dialog-button-row">
        <button type="button" id="exportStateBtn" class="dialog-confirm-btn">ファイルに保存</button>
        <button type="button" id="importStateBtn" class="dialog-confirm-btn">ファイルから読み込み</button>
        <input type="file" id="importStateInput" accept="application/json" style="display: none;">
      </div>
      <div class="dialog-button-row" style="margin-top: 16px;">
        <button type="submit" class="dialog-confirm-btn">閉じる</button>
      </div>
      <div class="dialog-button-row" style="margin-top: 24px;">
        <button type="button" id="deleteRoomBtn" class="dialog-danger-btn">部屋を削除</button>
      </div>
    </form>
  </dialog>
  <div class="app-container">
  <!-- 既存の盤面＋コントロールを、新しいラッパーで囲む -->
  <div class="main-area">
    <!-- キャラクター一覧は浮動パネル（js/character-panel.js）。body直下に動的生成するので
         ここにmarkupは無い -->
    <div class="board-area">
      <!-- ラウンド進行（Core機能）の常時表示ステータスバー。js/round-panel.js参照 -->
      <div class="round-panel-bar" id="roundPanelBar" style="display: none;">
        <span class="round-panel-status" id="roundPanelStatus">ラウンド進行前</span>
        <span class="round-panel-nickname" id="roundPanelNicknameLabel"></span>
        <button type="button" id="roundPanelReadyToggleBtn" class="round-panel-btn">割り込みなし</button>
        <button type="button" id="roundPanelActionBtn" class="round-panel-btn round-panel-action-btn">ラウンド進行を開始</button>
        <button type="button" id="roundPanelMenuBtn" class="round-panel-btn" title="参加者編集・終了">⋮</button>
        <div class="round-panel-ready-list" id="roundPanelReadyList"></div>
      </div>
      <div class="round-panel-detail" id="roundPanelDetail" style="display: none;"></div>

      <div id="board-viewport">
        <div id="board"></div>
        <!-- 3Dダイスの舞台（js/dice-animation.js）。中のcanvasはライブラリが作る -->
        <div id="dice-stage" class="dice-stage" aria-hidden="true"></div>
      </div>

      <!-- 盤面下1/4：既存ログのミラー表示。左側（キャラ一覧パネルと重なりうる領域）は
           チャット表示を置かず、直近に発言した参照キャラクターの立ち絵表示に充てる -->
      <div class="current-chat-bar" id="currentChatBar">
        <div class="current-chat-portrait" id="currentChatPortrait"></div>
        <div class="current-chat-log" id="currentChatLog"></div>
      </div>
    </div>

    <div class="control-area" id="controlArea">
      <!-- 上段：ログ＋チャットタブ。タブは入力欄に近い下側に置く -->
      <div class="log-section" data-resizable-section="log">
        <div class="log-container" id="logContainer">
          <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
        </div>
        <div class="chat-tabs" id="chatTabs"></div>
      </div>

      <!-- 下段：チャット送信欄＋チャットパレットを統合。ログとの間のみリサイズ可能 -->
      <div class="chat-send-panel" data-resizable-section="chatSend">
        <div class="panel chat-input-panel">
          <div class="chat-input-selects">
            <select id="characterParamSelect" class="compact-select" title="参照キャラクター（{パラメータ名}の置換・送信元）">
              <option value="">（選択なし）</option>
            </select>
          </div>
          <div class="chat-input-row">
            <textarea id="commandInput" rows="3" placeholder="CC(45) 隠れます／{HP}／+侵蝕率(10)"></textarea>
            <button class="btn-send" id="sendBtn">送信</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
