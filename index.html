<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>もじゅらX - 部屋一覧</title>
<link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
<style>
  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .app-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 2px solid #3a3a3a;
    padding-bottom: 8px;
    margin-bottom: 20px;
  }

  .app-header h1 {
    margin: 0;
    font-size: 1.4rem;
  }

  .app-header span {
    color: #888;
    font-size: 0.9rem;
  }

  .header-links {
    margin-bottom: 16px;
  }

  .header-links a {
    color: #8ab4f8;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .header-links a:hover {
    text-decoration: underline;
  }

  .room-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .room-card {
    background-color: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 14px 16px;
  }

  .room-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .room-card-title {
    font-weight: bold;
    font-size: 1.05rem;
  }

  .room-card-meta {
    color: #999;
    font-size: 0.85rem;
    margin-top: 2px;
  }

  .room-card.vacant .room-card-title {
    color: #888;
  }

  .btn {
    background-color: #007acc;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 0.9rem;
  }

  .btn:hover {
    background-color: #0090f0;
  }

  .btn-secondary {
    background-color: #444;
  }

  .btn-secondary:hover {
    background-color: #555;
  }

  .vacant-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    border-top: 1px solid #3a3a3a;
    padding-top: 10px;
  }

  .room-card.vacant.open .vacant-form {
    display: flex;
  }

  .vacant-form label {
    font-size: 0.8rem;
    color: #aaa;
    display: block;
    margin-bottom: 3px;
  }

  .vacant-form input[type="text"],
  .vacant-form select {
    width: 100%;
    background-color: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 8px;
    border-radius: 4px;
    box-sizing: border-box;
  }

  .vacant-form input[type="file"] {
    color: #ccc;
    font-size: 0.85rem;
  }

  .vacant-form-row {
    display: flex;
    gap: 8px;
  }

  .vacant-form-row > div {
    flex: 1;
  }

  .vacant-form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .error-text {
    color: #f28b82;
    font-size: 0.85rem;
    margin: 4px 0 0;
  }

  /* 狭幅（スマホ）。1カラムなので大きくは崩れないが、余白と当たり判定を詰め直す */
  @media (max-width: 900px) {
    body {
      padding: 12px;
    }

    .room-card-header {
      flex-wrap: wrap;
    }

    /* 部屋名と入室ボタンが同じ行に収まらない幅では、ボタンを次の行いっぱいに置く。
       .btnはcontent-boxなので、border-boxにしないと左右のpaddingの分だけはみ出す。 */
    .room-card-header .btn {
      flex: 1 0 100%;
      box-sizing: border-box;
      text-align: center;
    }

    /* 「盤面サイズ 横×縦」のような横並びは、指では狭すぎるので縦に積む */
    .vacant-form-row {
      flex-direction: column;
    }
  }

  /* 指で操作する環境では、押せるものを44px前後まで持ち上げる */
  @media (pointer: coarse) {
    .btn {
      padding: 12px 18px;
      font-size: 1rem;
    }

    .vacant-form input[type="text"],
    .vacant-form select {
      padding: 10px 8px;
      /* iOS Safariは16px未満の入力欄にフォーカスすると画面を勝手に拡大する */
      font-size: 16px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="app-header">
      <h1>🎲 もじゅらX</h1>
      <span>部屋一覧</span>
    </div>
    <div class="header-links">
      <a href="/character-builder.html">🛠️ コマ作成ツール（外部シート/スナップショットJSONから）</a>
    </div>

    <div id="roomList" class="room-list">
      <p style="color:#888;">読み込み中...</p>
    </div>
  </div>

  <script type="module" src="/js/room-index.js"></script>
</body>
</html>
