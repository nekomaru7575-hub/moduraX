<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPGセッション支援 - ダイスパネル</title>
  <style>
    /* ========================================================
       CSSエリア：画面の見た目（デザイン）を整える場所
       ======================================================== */
    
    /* 全体の背景をココフォリア風のダークモードにする */
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-bottom: 20px;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      width: 100%;
      max-width: 500px;
    }

    /* コントロールパネル（入力欄やボタンの枠） */
    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    /* 入力フォームの並びを整える（縦並び） */
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    /* セレクトボックスと入力欄の共通デザイン */
    select, input[type="text"] {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: #007acc; /* フォーカス時に青く光らせる */
    }

    /* 送信ボタンのデザイン */
    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff; /* マウスを乗せたときに少し明るく */
    }

    /* 送信ボタンが無効化（disabled）された時のデザイン */
    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    /* ダイスログの表示エリア */
    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      height: 250px;
      overflow-y: auto; /* ログが増えたらスクロールさせる */
      padding: 10px;
      box-sizing: border-box;
    }

    /* ログの1行ごとのデザイン */
    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out; /* 出現時のアニメーション */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>🎲 TRPG Dice Control Panel</h1>

  <div class="panel">
    <div class="form-group">
      <label for="gameSystem">ゲームシステム</label>
      <select id="gameSystem">
        <option value="Cthulhu7th">クトゥルフ神話TRPG (7版)</option>
        <option value="DoubleCross">ダブルクロス (3rd)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="commandInput">コマンド入力 (例: CC(45) 隠れるロール)</label>
      <input type="text" id="commandInput" placeholder="CC(45) 隠れます" autocomplete="off">
    </div>

    <button class="btn-send" id="sendBtn">ダイスを振る</button>
  </div>

  <div class="log-container" id="logContainer">
    <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
  </div>

  <script type = "module" src="./js/main.js"></script>
</body>
</html>
