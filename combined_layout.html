<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もじゅらX</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin: 0;
      flex: 1;
    }

    .net-status {
      font-size: 0.8rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .room-name-label {
      color: #999;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .net-status-connected {
      color: #4caf50;
    }

    .net-status-connecting {
      color: #e0a020;
    }

    .net-status-disconnected {
      color: #e05252;
    }

    .room-menu-btn {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .room-menu-btn:hover {
      background-color: #3a3a3a;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 75px);
      gap: 20px;
      box-sizing: border-box;
    }
    /* ダイアログ */
    .character-dialog {
      background-color: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      min-width: 320px;
      max-width: 720px;
    }

    .dialog-columns {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .dialog-main-column {
      flex: 1;
      min-width: 260px;
    }

    .dialog-plugin-column {
      flex: 1;
      min-width: 220px;
      padding-left: 20px;
      border-left: 1px solid #444;
    }

    .dialog-plugin-placeholder {
      color: #777;
      font-size: 0.85rem;
      margin: 0;
    }

    /* エフェクト等の「ボックス」編集ダイアログ */
    .effect-box-dialog {
      width: 100%;
      max-width: 640px;
    }

    .effect-box-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 50vh;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .effect-box-item {
      background-color: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .effect-box-header-row {
      display: flex;
      gap: 6px;
    }

    .effect-box-header-row input {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .effect-box-name {
      flex: 2;
      min-width: 0;
    }

    .effect-box-timing {
      flex: 0 0 84px;
    }

    .effect-box-level {
      flex: 0 0 56px;
    }

    .effect-box-encroach {
      flex: 0 0 90px;
    }

    .effect-box-note {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
      resize: vertical;
      font-family: inherit;
    }

    .effect-box-limits {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .effect-box-limit-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: #ccc;
    }

    .effect-box-limit-label {
      color: #aaa;
      width: 4em;
      flex-shrink: 0;
    }

    .effect-box-limit-current,
    .effect-box-limit-max {
      width: 52px;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .effect-box-limit-slash {
      color: #888;
    }

    .effect-box-limit-eb {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 8px;
    }

    /* エフェクトの「コンボ時修正」6項目。回数制限の行と同じ雰囲気で小さくまとめる */
    .effect-box-combo-mods {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #444;
    }

    .effect-box-combo-title {
      color: #aaa;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .effect-box-combo-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .effect-box-combo-field {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: #ccc;
    }

    .effect-box-combo-label {
      color: #999;
      white-space: nowrap;
    }

    .effect-box-combo-input {
      width: 44px;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 4px 6px;
      border-radius: 4px;
    }

    /* 能力・技能値の表示ボックス */
    .ability-box-dialog {
      width: 100%;
      max-width: 480px;
    }

    .ability-box-group-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 12px;
    }

    .ability-box-group {
      background-color: #333;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .ability-box-ability-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ability-box-ability-label {
      font-size: 1rem;
      color: #ccc;
    }

    .ability-box-ability-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
    }

    .ability-box-skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
    }

    .ability-box-skill {
      font-size: 0.8rem;
      color: #aaa;
    }

    .ability-box-skill-empty {
      color: #666;
    }

    .character-dialog::backdrop {
      background: rgba(0, 0, 0, 0.5);
    }

    .character-dialog h3 {
      margin-top: 0;
      color: #fff;
    }

    .dialog-form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .dialog-form-group label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .dialog-form-group input {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
    }

    /* コマ画像トリミング用の正方形クロッパー。中の画像をドラッグして位置調整、
       ホイール/スライダーでズームする。コマは常にN×Nの正方形なので枠も正方形。 */
    .image-cropper {
      width: 160px;
      height: 160px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #555;
      background-color: #111;
      margin-bottom: 8px;
      cursor: grab;
      touch-action: none; /* ドラッグ中にスクロール/ジェスチャへ取られないように */
      position: relative;
    }

    .image-cropper:active {
      cursor: grabbing;
    }

    .image-cropper-img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .image-crop-zoom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 0.85rem;
    }

    .image-crop-zoom-row input[type="range"] {
      flex: 1;
    }

    .dialog-custom-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .dialog-custom-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* バフ/デバフ一覧の説明テキスト（名前・対象パラメータ・増減値・終了条件をまとめた1行） */
    .buff-row-info {
      flex: 1;
      color: #ddd;
      font-size: 0.9rem;
    }

    /* 既存パラメータ一覧のラベル列。幅を固定し、数値入力・表示・削除の縦位置を全行で揃える */
    .dialog-param-label {
      flex: 0 0 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dialog-custom-row input {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 8px;
      border-radius: 4px;
      flex: 1;
    }

    /* 数値入力欄はテキスト欄と同じ比率で広げる必要がないため、幅を固定して小さくする（元の約1/5）。
       min-width:0がないと、input要素のデフォルトの自動最小幅に負けて縮まないため必須 */
    .dialog-custom-row input[type="number"] {
      flex: 0 0 38px;
      min-width: 0;
      width: 38px;
      box-sizing: border-box;
      padding: 6px 4px;
      text-align: right;
    }

    .dialog-remove-row {
      background-color: #444;
      color: #ddd;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 0 10px;
      cursor: pointer;
    }

    .dialog-add-row-btn {
      background: none;
      border: 1px dashed #555;
      color: #aaa;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
    }

    .dialog-button-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .dialog-button-row button {
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    .dialog-confirm-btn {
      background-color: #007acc;
      color: #fff;
      font-weight: bold;
    }

    /* キャラクター一覧のパラメータ表示 */
    .character-param-list {
      margin-top: 4px;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .character-param-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #bbb;
    }

    /* キャラ一覧サイドバー専用（ルーム変数一覧とは見た目を分ける） */
    .character-list-param-row {
      display: grid;
      grid-template-columns: 4.4em 1fr;
      column-gap: 8px;
      font-size: 0.8rem;
      color: #bbb;
    }

    .character-param-label {
      color: #2ecc71;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .character-param-value {
      text-align: left;
    }
/* キャラクター一覧：main-area内に浮かせるオーバーレイ。
   盤面・チャット（board-area/control-area）のflex比率には関与しない。 */
    .character-panel-area {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 220px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      transition: width 0.15s ease;
      pointer-events: none;
    }

    .character-panel-area > * {
      pointer-events: auto;
    }

    .character-panel-area.collapsed {
      width: 28px;
    }

    .character-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
    }

    .character-panel-area.collapsed .character-panel {
      display: none;
    }

    .character-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .character-panel-header label {
      margin: 0;
    }

    .character-panel-collapse-btn {
      background: none;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      cursor: pointer;
      width: 22px;
      height: 22px;
      font-size: 0.8rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .character-panel-collapse-btn:hover {
      background-color: #3a3a3a;
    }

    .character-panel-expand-strip {
      display: none;
      width: 100%;
      height: 100%;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 4px 0 16px rgba(0, 0, 0, 0.5);
      color: #aaa;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      writing-mode: vertical-rl;
      letter-spacing: 2px;
      font-size: 0.8rem;
    }

    .character-panel-area.collapsed .character-panel-expand-strip {
      display: flex;
    }

    .character-panel-expand-strip:hover {
      background-color: #3a3a3a;
    }

    /* バックヤードパネル：キャラ一覧パネルと同じ挙動を右側に配置しただけの変種 */
    .backyard-panel-area {
      left: auto;
      right: 0;
    }

    .backyard-panel-area .character-panel {
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
    }

    .backyard-panel-area .character-panel-expand-strip {
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.5);
    }

/* 盤面＋コントロールのコンテナ。キャラ一覧オーバーレイの基準位置にもなる */
    .main-area {
      position: relative;
      flex: 1;
      display: flex;
      gap: 20px;
      height: 100%;
      min-width: 0; /* flexアイテムが縮まないバグを防止 */
    }

    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #board-viewport {
      position: relative;
      width: 100%;
      flex: 3;
      min-height: 0;
      overflow: hidden; /* パン・ズームしてはみ出た部分をここで切り取る */
      cursor: grab;
    }

    /* 盤面下1/4：既存ログのミラー表示エリア */
    .current-chat-bar {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    /* キャラ一覧パネル（オーバーレイ）と重なりうる左側領域。
       通常のログは置かず、直近に発言した参照キャラクターの立ち絵（未設定なら空）だけを表示する */
    .current-chat-portrait {
      flex: 0 0 220px;
      height: 100%;
      background-color: #111;
      background-size: contain;
      background-position: bottom center;
      background-repeat: no-repeat;
    }

    .current-chat-log {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      padding: 8px 12px;
      box-sizing: border-box;
    }

    .current-chat-log-item {
      font-size: 1.05rem;
      color: #ddd;
      animation: fadeIn 0.3s ease-out;
    }

    /* ダイス結果等の本文。通常のログでは1.1rem、カレントチャット欄では
       最新発言1件だけを大きく見せたいのでさらに拡大する */
    .log-result-text {
      font-size: 1.1rem;
    }

    .current-chat-log-item .log-result-text {
      font-size: 1.4rem;
    }

    #board {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #808080;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 25px 25px, 25px 25px;
      background-position: 0 0, 0 0;
      background-repeat: repeat, repeat;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
      transform-origin: 0 0;
    }

    .token {
      width: 25px;
      height: 25px;
      background-color: transparent;
      overflow: hidden;
      border: 2px solid #ffffff;
      border-radius: 10px;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
      z-index: 10;
      transition: top 0.05s ease-out, left 0.05s ease-out;
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
      transition: none;
    }

    /* コマ画像。内側に敷き、トリミング設定(object-position/transform)で見え方を変える。
       名前(.token-name)より下に来るよう、名前側にz-indexを持たせている。 */
    .token-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .token-name {
      position: relative;
      z-index: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* パネル：コマの下に敷くマップタイル状オブジェクト（盤面上／盤面外に配置可能） */
    .panel-object {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.06);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      box-sizing: border-box;
      cursor: grab;
      user-select: none;
      z-index: 5;
    }

    .panel-object:active {
      cursor: grabbing;
    }

    /* 固定中のパネル：ドラッグ移動できない（背景タイル扱い）。実線枠と通常カーソルで示す */
    .panel-object.locked {
      cursor: default;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .panel-object.locked:active {
      cursor: default;
    }

    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
      overflow-y: auto;
    }

    /* チャット送信欄＋チャットパレットの統合区画。ログとの間のみリサイズ可能 */
    .chat-send-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    /* チャット欄：ゲームシステム/参照キャラクターの選択は小さく横並びにする */
    .chat-input-panel {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-input-selects {
      display: flex;
      gap: 6px;
    }

    .compact-select {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font-size: 0.75rem;
    }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-input-row textarea {
      flex: 1;
      min-width: 0;
      resize: vertical;
      font-family: inherit;
      line-height: 1.4;
    }

    .chat-input-row .btn-send {
      width: auto;
      flex-shrink: 0;
      align-self: stretch;
      padding: 8px 16px;
    }

    /* チャットパレット：保存フレーズをクリックだけで送信できるボタン一覧 */
    .chat-palette-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .chat-palette-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }

    .chat-palette-btn {
      background-color: #333;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-palette-btn:hover {
      background-color: #3f3f3f;
    }

    .chat-palette-empty {
      color: #666;
      font-size: 0.8rem;
      margin: 0;
      padding: 4px;
    }

    .chat-palette-edit-btn {
      align-self: flex-end;
      background: none;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-palette-edit-btn:hover {
      background-color: #3a3a3a;
    }

    .chat-palette-editor-dialog {
      width: 100%;
      max-width: 480px;
    }

    .chat-palette-editor-hint {
      color: #999;
      font-size: 0.8rem;
      margin: 0 0 8px;
    }

    .chat-palette-editor-textarea {
      width: 100%;
      min-height: 240px;
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
    }

    /* ログ／チャット欄／チャットパレットの高さをユーザーがドラッグで調整するためのハンドル */
    .resize-handle {
      flex: 0 0 10px;
      cursor: row-resize;
      position: relative;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      left: 25%;
      right: 25%;
      top: 4px;
      height: 2px;
      background-color: #444;
      border-radius: 1px;
    }

    .resize-handle:hover::after,
    .resize-handle.dragging::after {
      background-color: #007acc;
    }

    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"], textarea {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .log-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .chat-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding-bottom: 6px;
      overflow-x: auto;
    }

    .chat-tab {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 4px 4px 0 0;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chat-tab:hover {
      background-color: #333;
      color: #fff;
    }

    .chat-tab.active {
      background-color: #007acc;
      color: #fff;
      border-color: #007acc;
    }

    .chat-tab-add {
      background: none;
      color: #888;
      border: 1px dashed #555;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-tab-add:hover {
      color: #fff;
      border-color: #007acc;
    }

    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #characterList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .character-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #333;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .character-avatar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .character-avatar {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #fff;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .character-avatar-initiative {
      position: absolute;
      top: -4px;
      left: -4px;
      min-width: 14px;
      height: 14px;
      padding: 0 2px;
      background-color: #1a1a1a;
      color: #fff;
      border: 1px solid #888;
      border-radius: 3px;
      font-size: 0.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-avatar-name {
      font-size: 0.65rem;
      color: #bbb;
      max-width: 44px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .context-menu {
      position: fixed;
      z-index: 1000;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      min-width: 140px;
      overflow: hidden;
      padding: 4px;
    }

    .context-menu-item {
      background: none;
      border: none;
      color: #e0e0e0;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.9rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .context-menu-item:hover {
      background-color: #3a3a3a;
    }

    .context-menu-item.danger:hover {
      background-color: #a8323f;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🎲 もじゅらX</h1>
    <span id="roomNameLabel" class="room-name-label"></span>
    <span id="netStatus" class="net-status net-status-connecting">● 接続中...</span>
    <button id="roomMenuBtn" class="room-menu-btn" title="ルームメニュー" type="button">⋮</button>
  </div>

  <dialog id="roomSettingsDialog" class="character-dialog">
    <form method="dialog">
      <h3>ルーム設定</h3>
      <div class="dialog-form-group">
        <label for="roomNameInput">部屋名</label>
        <input type="text" id="roomNameInput">
      </div>
      <div class="dialog-form-group">
        <label for="gameSystem">BCDiceのシステム（ダイスロールの解釈規則）</label>
        <select id="gameSystem">
          <option value="Cthulhu7th">クトゥルフ神話TRPG (7版)</option>
          <option value="DoubleCross">ダブルクロス (3rd)</option>
        </select>
      </div>
      <div class="dialog-form-group">
        <label for="roomPluginSelect">ルームのプラグイン（システム）</label>
        <select id="roomPluginSelect"></select>
      </div>
      <label style="margin-top: 8px; display: block;">ルーム変数</label>
      <div id="roomParameterList" class="character-param-list"></div>
      <label style="margin-top: 8px; display: block;">セッションデータ</label>
      <div class="dialog-button-row">
        <button type="button" id="exportStateBtn" class="dialog-confirm-btn">ファイルに保存</button>
        <button type="button" id="importStateBtn" class="dialog-confirm-btn">ファイルから読み込み</button>
        <input type="file" id="importStateInput" accept="application/json" style="display: none;">
      </div>
      <div class="dialog-button-row" style="margin-top: 16px;">
        <button type="submit" class="dialog-confirm-btn">閉じる</button>
      </div>
    </form>
  </dialog>
  <div class="app-container">
  <!-- 既存の盤面＋コントロールを、新しいラッパーで囲む -->
  <div class="main-area">
    <!-- キャラクター一覧：main-area内に浮かせるオーバーレイ。board-area/control-areaの大きさには影響しない -->
      <div class="character-panel-area" id="characterPanelArea">
        <div class="panel character-panel">
          <div class="character-panel-header">
            <label>登録済みキャラクター</label>
            <button type="button" id="characterPanelCollapseBtn" class="character-panel-collapse-btn" title="折りたたむ">◂</button>
          </div>
          <div id="characterList" style="flex: 1; max-height: none;"></div>
        </div>
        <button type="button" id="characterPanelExpandBtn" class="character-panel-expand-strip" title="展開する">キャラクター一覧</button>
      </div>

      <!-- バックヤード：盤面からしまったコマの個人保管場所。自分がしまったコマだけが見える
           （操作権自体は制限しない、UI上の絞り込みのみ）。character-panel-areaと同じ
           折りたたみ挙動を右側に配置する。 -->
      <div class="character-panel-area backyard-panel-area" id="backyardPanelArea">
        <div class="panel character-panel">
          <div class="character-panel-header">
            <label>バックヤード</label>
            <button type="button" id="backyardPanelCollapseBtn" class="character-panel-collapse-btn" title="折りたたむ">▸</button>
          </div>
          <div id="backyardList" style="flex: 1; max-height: none;"></div>
        </div>
        <button type="button" id="backyardPanelExpandBtn" class="character-panel-expand-strip" title="展開する">バックヤード</button>
      </div>

    <div class="board-area">
      <div id="board-viewport">
        <div id="board"></div>
      </div>

      <!-- 盤面下1/4：既存ログのミラー表示。左側（キャラ一覧パネルと重なりうる領域）は
           チャット表示を置かず、直近に発言した参照キャラクターの立ち絵表示に充てる -->
      <div class="current-chat-bar" id="currentChatBar">
        <div class="current-chat-portrait" id="currentChatPortrait"></div>
        <div class="current-chat-log" id="currentChatLog"></div>
      </div>
    </div>

    <div class="control-area" id="controlArea">
      <!-- 上段：チャットタブ＋ログ -->
      <div class="log-section" data-resizable-section="log">
        <div class="chat-tabs" id="chatTabs"></div>
        <div class="log-container" id="logContainer">
          <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
        </div>
      </div>

      <!-- 下段：チャット送信欄＋チャットパレットを統合。ログとの間のみリサイズ可能 -->
      <div class="chat-send-panel" data-resizable-section="chatSend">
        <div class="panel chat-input-panel">
          <div class="chat-input-selects">
            <select id="characterParamSelect" class="compact-select" title="参照キャラクター（{パラメータ名}の置換・送信元）">
              <option value="">（選択なし）</option>
            </select>
          </div>
          <div class="chat-input-row">
            <textarea id="commandInput" rows="3" placeholder="CC(45) 隠れます／{HP}／+侵蝕率(10)"></textarea>
            <button class="btn-send" id="sendBtn">送信</button>
          </div>
        </div>

        <div class="chat-palette-panel" id="chatPalettePanel"></div>
      </div>
    </div>
  </div>

</div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
