<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>もじゅらX - コマ作成ツール</title>
<link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
<!-- 色のトークン。character-dialog.cssより必ず先に読むこと（var()の定義元） -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/character-dialog.css">

<!-- PWA。3つのHTMLで同じものを並べている。意図は index.html 側のコメントに書いた。 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="もじゅらX">
<link rel="apple-touch-icon" href="/image/apple-touch-icon-180.png">
<style>
  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    font-family: var(--font-body);
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .app-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 2px solid #3a3a3a;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .app-header h1 {
    margin: 0;
    font-size: 1.4rem;
  }

  .app-header span {
    color: #888;
    font-size: 0.9rem;
  }

  .back-link {
    display: inline-block;
    color: #8ab4f8;
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }

  .back-link:hover {
    text-decoration: underline;
  }

  .builder-card {
    background-color: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 16px;
  }

  .builder-form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
  }

  .builder-form-group label {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 4px;
  }

  .builder-form-group select,
  .builder-form-group input[type="file"] {
    background-color: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 8px;
    border-radius: 4px;
  }

  .builder-hint {
    color: #888;
    font-size: 0.8rem;
    margin: 0 0 12px;
  }

  .builder-primary-btn {
    background-color: #007acc;
    color: #fff;
    font-weight: bold;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
  }

  .builder-primary-btn:disabled {
    background-color: #444;
    color: #888;
    cursor: not-allowed;
  }

  .builder-secondary-btn {
    background: none;
    border: 1px solid #555;
    color: #ddd;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
  }

  .builder-status {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #9fd39f;
  }

  .builder-error {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #f28b82;
  }

  .builder-action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="app-header">
      <!-- ロゴはfaviconと同じ画像（見た目の指定は css/tokens.css の .app-logo） -->
      <h1 class="app-title"><img class="icon-lead app-logo" src="/image/iconDediDevi.ico" alt="">もじゅらX</h1>
      <span>コマ作成ツール</span>
    </div>
    <a class="back-link" href="/">← 部屋一覧に戻る</a>

    <div id="builderRoot"></div>
  </div>

  <script type="module" src="/js/character-builder.js"></script>
</body>
</html>
