<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=coverが要るのは、env(safe-area-inset-*)を効かせるため。これが無いと
     insetは常に0を返し、ノッチやホームバーを避ける指定が黙って無視される。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>もじゅらX - 部屋一覧</title>

<!-- SNSに貼られたときのカード（OGP / Twitter Card）。
     クローラは相対パスを解決しないので、og:imageとog:urlは絶対URLで書くこと。
     画像はimage/配下に置く。docs/配下はserver/index.jsのPUBLIC_DIRSに無く、
     ブラウザでは見えても配信されず404になる（READMEのスクショを直に指すと事故る）。
     カードの実寸は横500px前後まで縮む。全画面のスクショを貼ると文字が潰れるため、
     image/ogp.pngは盤面の一部をほぼ等倍で切り出したものにしてある。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="もじゅらX">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="もじゅらX">
<meta property="og:description" content="ブラウザで開くだけのオンラインセッションツール。登録もインストールも要りません。部屋を作って、盤面・チャット・ダイスを参加者みんなで共有できます。">
<meta property="og:url" content="https://modurax.onrender.com/">
<meta property="og:image" content="https://modurax.onrender.com/image/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="もじゅらXの盤面。コマとキャラクター一覧、秘匿つきHOのパネル、スタンプが並んでいる。">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/image/iconDediDevi.ico">
<!-- 書体と色のトークン。このページの色はまだ直書きだが、書体だけは共通のものを使う -->
<link rel="stylesheet" href="/css/tokens.css">

<!-- PWA（ホーム画面／デスクトップへのインストール）。詳しくは manifest.webmanifest と sw.js。 -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOSはmobile-web-app-capableをまだ見ないので、旧名も並べる -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucentにすると全画面になる代わりに中身がステータスバーの下へ潜り込む。
     ヘッダーを作り直す必要が出るので、不透過のblackにしている。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="もじゅらX">
<!-- iOSは透過PNGの透明部分を黒く塗るので、これだけ背景を焼き込んだ別画像 -->
<link rel="apple-touch-icon" href="/image/apple-touch-icon-180.png">
<style>
  html {
    /* ホーム画面から起動した状態で「引っ張って更新」が暴発しないようにする */
    overscroll-behavior: none;
  }

  body {
    background-color: #1a1a1a;
    color: #e0e0e0;
    font-family: var(--font-body);
    margin: 0;
    /* 20pxを下限に、ノッチ・ホームバーのぶんだけ広げる（横向きのiPhone等） */
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  .app-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 2px solid #3a3a3a;
    padding-bottom: 8px;
    margin-bottom: 20px;
  }

  .app-header h1 {
    margin: 0;
    font-size: 1.4rem;
  }

  .app-header span {
    color: #888;
    font-size: 0.9rem;
  }

  /* 「アプリとして追加」（js/pwa.js）の置き場所。出せる状況でしか中身が入らないので、
     空のときは下の余白も作らない。 */
  .install-prompt {
    margin-bottom: 16px;
  }

  .install-prompt:empty {
    margin-bottom: 0;
  }

  .site-footer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid #333;
    font-size: 0.85rem;
  }

  .site-footer a {
    color: #8ab4f8;
    text-decoration: none;
  }

  .site-footer a:hover {
    text-decoration: underline;
  }

  /* 権利表示。義務なので出すが、部屋を探しに来た人の邪魔をしない大きさに留める。 */
  .footer-rights {
    margin: 8px 0 0;
    font-size: 0.75rem;
    line-height: 1.6;
    color: #999;
  }

  /* --- 混雑状況（js/room-index.jsが中身を作る） --- */
  .server-status {
    background-color: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }

  .server-status-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 混み具合の信号。色だけに頼らないよう、隣の見出し（空いています等）が同じことを言う */
  .server-status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
    background-color: #5fbf5f;
  }

  .server-status.busy .server-status-dot { background-color: #e0b13a; }
  .server-status.crowded .server-status-dot { background-color: #f28b82; }
  .server-status.unknown .server-status-dot { background-color: #777; }

  .server-status-level {
    font-weight: bold;
    font-size: 0.95rem;
  }

  .server-status-refresh {
    margin-left: auto;
    padding: 4px 12px;
    font-size: 0.8rem;
  }

  /* 指で操作する環境では.btnが大きくなるが、ここは補助的な操作なので小さいまま残す */
  @media (pointer: coarse) {
    .server-status-refresh {
      padding: 8px 14px;
      font-size: 0.85rem;
    }
  }

  .server-status-metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 16px;
    margin-top: 6px;
    color: #999;
    font-size: 0.8rem;
  }

  .server-status-metrics b {
    color: #ccc;
    font-weight: bold;
  }

  .server-status-note {
    margin: 6px 0 0;
    font-size: 0.8rem;
    color: #e0b13a;
  }

  /* --- 入室・新規作成の2枚（js/room-index.jsが中身を作る） --- */
  .panel {
    background-color: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .panel h2 {
    margin: 0 0 10px;
    font-size: 1.05rem;
  }

  /* 「部屋を探す」の1行。狭い画面では下の@mediaで縦に積む */
  .entry-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .entry-row select {
    flex: 1;
    min-width: 0; /* これが無いと、長い部屋名でselectが親からはみ出す */
  }

  .entry-search {
    margin-bottom: 8px;
  }

  /* 選択中の部屋の説明（プラグイン・システム・人数）。 */
  .room-info {
    color: #999;
    font-size: 0.85rem;
    margin-top: 8px;
    min-height: 1.2em; /* 選択のたびに下の要素が跳ねないよう、1行ぶん先に空けておく */
  }

  /* 自動削除が近い部屋の一行（js/room-index.jsのdescribeExpiry）。
     見落とすと卓が消えるので、他のメタ情報より強い色で出す。 */
  .room-expiry {
    color: #ffd479;
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* 入れない・作れないときの理由。サーバーが断る根拠をそのまま出す */
  .panel-blocked {
    color: #e0b13a;
    font-size: 0.85rem;
    margin: 8px 0 0;
  }

  .btn {
    background-color: #007acc;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 0.9rem;
  }

  .btn:hover {
    background-color: #0090f0;
  }

  .btn-secondary {
    background-color: #444;
  }

  .btn-secondary:hover {
    background-color: #555;
  }

  .create-form {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    border-top: 1px solid #3a3a3a;
    padding-top: 10px;
  }

  .panel.open .create-form {
    display: flex;
  }

  label {
    font-size: 0.8rem;
    color: #aaa;
    display: block;
    margin-bottom: 3px;
  }

  input[type="text"],
  input[type="search"],
  input[type="password"],
  select {
    width: 100%;
    background-color: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 8px;
    border-radius: 4px;
    box-sizing: border-box;
  }

  input[type="file"] {
    color: #ccc;
    font-size: 0.85rem;
  }

  .create-form-row {
    display: flex;
    gap: 8px;
  }

  .create-form-row > div {
    flex: 1;
  }

  .create-form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  /* 押せないボタン（枠が満杯・置き場の残量不足）。理由は隣の.panel-blockedに出す */
  .btn:disabled,
  .btn:disabled:hover {
    background-color: #3a3a3a;
    color: #888;
    cursor: not-allowed;
  }

  .error-text {
    color: #f28b82;
    font-size: 0.85rem;
    margin: 4px 0 0;
  }

  /* 狭幅（スマホ）。1カラムなので大きくは崩れないが、余白と当たり判定を詰め直す */
  @media (max-width: 900px) {
    body {
      /* 下限だけ12pxへ詰める。safe-areaのぶんは残す（上のbodyと同じ組み立て） */
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
               max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    /* プルダウンと入室ボタンが1行に収まらない幅では、縦に積んでどちらも全幅にする。
       .btnはcontent-boxなので、border-boxにしないと左右のpaddingの分だけはみ出す。 */
    .entry-row {
      flex-direction: column;
      align-items: stretch;
    }

    .entry-row .btn {
      box-sizing: border-box;
      text-align: center;
    }

    /* プラグインとBCDiceシステムの横並びは、指では狭すぎるので縦に積む */
    .create-form-row {
      flex-direction: column;
    }
  }

  /* 指で操作する環境では、押せるものを44px前後まで持ち上げる */
  @media (pointer: coarse) {
    .btn {
      padding: 12px 18px;
      font-size: 1rem;
    }

    input[type="text"],
    input[type="search"],
    input[type="password"],
    select {
      padding: 10px 8px;
      /* iOS Safariは16px未満の入力欄にフォーカスすると画面を勝手に拡大する */
      font-size: 16px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="app-header">
      <!-- ロゴはfaviconと同じ画像（見た目の指定は css/tokens.css の .app-logo）。
           alt=""なのは、すぐ隣に「もじゅらX」と書いてあるため（読み上げで名前を
           二度言わせない） -->
      <h1 class="app-title"><img class="icon-lead app-logo" src="/image/iconDediDevi.ico" alt="">もじゅらX</h1>
      <span>部屋一覧</span>
      <!-- 他のページ（コマ作成ツール・このサービスについて）への行き先。中身はjs/site-nav.js -->
      <button id="siteMenuBtn" class="app-menu-btn" type="button" title="メニュー" aria-label="メニュー"></button>
    </div>
    <div id="installPrompt" class="install-prompt"></div>

    <div id="serverStatus"></div>

    <!-- 入室（部屋名で探す／プルダウンから選ぶ）と、新規作成。
         中身はどちらもjs/room-index.jsが組み立てる。 -->
    <div id="roomEntry" class="panel">
      <p style="color:#888;margin:0;">読み込み中...</p>
    </div>
    <div id="roomCreate" class="panel"></div>

    <!-- 利用規約・プライバシーポリシー・免責事項・問い合わせ先。
         公開するサービスとして、画面から辿れる場所に置いておく必要がある。
         2行目は二次創作活動のガイドラインが求める権利表示への導線。ガイドラインは
         「ウェブページならトップページやタイトルページに」と場所を指定しているので、
         about.htmlの中に埋めるだけにせず、ここから名指しで辿れるようにしてある。 -->
    <footer class="site-footer">
      <a href="/about.html">このサービスについて（利用規約・プライバシー・問い合わせ）</a>
      <p class="footer-rights">
        もじゅらXは『ダブルクロス The 3rd Edition』『忍術バトルRPG シノビガミ』
        『常夜国騎士譚RPG ドラクルージュ』『アリアンロッドRPG２E』『銀剣のステラナイツ』
        『グランクレストＲＰＧ』の二次創作物です（公式・公認ではありません）。
        <a href="/about.html#rights">権利表示</a>
      </p>
    </footer>
  </div>

  <script type="module" src="/js/room-index.js"></script>
  <script type="module" src="/js/site-nav.js"></script>
</body>
</html>
