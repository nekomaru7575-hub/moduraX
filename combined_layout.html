<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRPG支援アプリ - 統合レイアウトプロトタイプ</title>
  <style>
    /* ========================================================
       全体の基本デザイン（ダークモード基調）
       ======================================================== */
    body {
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 2px solid #3a3a3a;
      padding-bottom: 5px;
      width: 100%;
    }

    /* ========================================================
       左右 7:3 分割レイアウト
       ======================================================== */
    .app-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 75px);
      gap: 20px;
      box-sizing: border-box;
    }

    /* 左側：盤面エリア (70%) */
    .board-area {
      flex: 7;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #board {
      width: 100%;
      height: 100%;
      background-color: #262626;
      border: 2px solid #444444;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      
      /* 50px四方の方眼グリッドを描画 */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* コマ（トークン）のデザイン */
    .token {
      width: 40px;
      height: 40px;
      background-color: #ff4757;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      user-select: none;
      z-index: 10;
    }

    .token:active {
      cursor: grabbing;
      transform: scale(1.1);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
    }

    .token-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }

    /* 右側：コントロール＆チャットエリア (30%) */
    .control-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-width: 320px;
    }

    /* コントロールパネル */
    .panel {
      background-color: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    select, input[type="text"] {
      background-color: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: #007acc;
    }

    .btn-send {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background-color: #0098ff;
    }

    .btn-send:disabled {
      background-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    /* ダイスログ表示エリア */
    .log-container {
      background-color: #222;
      border: 1px solid #333;
      border-radius: 8px;
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      box-sizing: border-box;
    }

    .log-item {
      border-bottom: 1px solid #333;
      padding: 8px 5px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>🎲 TRPG支援アプリ：盤面＆ダイスパネル統合（レイアウト版）</h1>

  <div class="app-container">
    
    <!-- 左側：盤面エリア (70%) -->
    <div class="board-area">
      <div id="board">
        <!-- コマの初期配置 -->
        <div class="token" style="left: 100px; top: 150px;">
          <span class="token-name">リリィ</span>
        </div>
        
        <div class="token" style="left: 300px; top: 200px; background-color: #2ed573;">
          <span class="token-name">ラグナ</span>
        </div>
      </div>
    </div>

    <!-- 右側：コントロールエリア (30%) -->
    <div class="control-area">
      <!-- 操作パネル -->
      <div class="panel">
        <div class="form-group">
          <label for="gameSystem">ゲームシステム</label>
          <select id="gameSystem">
            <option value="Cthulhu7th">クトゥルフ神話TRPG (7版)</option>
            <option value="DoubleCross">ダブルクロス (3rd)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="commandInput">コマンド入力 (例: CC(45) 隠れるロール)</label>
          <input type="text" id="commandInput" placeholder="CC(45) 隠れます" autocomplete="off">
        </div>

        <button class="btn-send" id="sendBtn">ダイスを振る</button>
      </div>

      <!-- ログコンテナ -->
      <div class="log-container" id="logContainer">
        <div class="log-item" style="color: #888;">ここにダイスログが表示されます...</div>
      </div>
    </div>

  </div>

  <!-- ========================================================
       外部スクリプトの読み込み（独立したまま維持）
       ======================================================== */ -->
  <script type="module" src="./js/main.js"></script>
  <script src="./js/board-drag.js"></script>
</body>
</html>
